<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<div th:fragment="view">
    <div id="app-container" style="margin:0; display:flex; height:100vh; font-family:Arial, sans-serif;">
        <div id="left-panel">
            <div id="object-panel" >
                <div class="row" style="margin-bottom:5px;">
                    <div class="input-group col-12">
                        <input type="text" class="form-control form-control-sm rounded-0" id="objectCode" placeholder="오브젝트코드 입력" spellcheck="false" autocomplete="off" data-watch="true" >
                        <input type="text" class="form-control form-control-sm rounded-0" id="objectName" placeholder="" spellcheck="false" autocomplete="off" data-watch="true" disabled>
                        <span class="input-group-append">
                        <button type="button" class="btn btn-default btn-sm" onclick="openPopupObject()">
                            <i class="fas fa-search"></i>
                        </button>
                    </span>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group col-12">
                        <button type="button" class="btn btn-default btn-sm" onclick="createObject()">
                            <i class="fas fa-plus-square"></i><span>Create</span>
                        </button>
                        <button type="button" class="btn btn-default btn-sm" onclick="load()">
                            <i class="fas fa-download"></i><span>Load</span>
                        </button>
                        <button type="button" class="btn btn-default btn-sm" onclick="openPopupMenu()">
                            <i class="fas fa-th-list"></i><span>Menu</span>
                        </button>
                    </div>
                </div>
            </div>

            <hr style="border: none; border-top: 1px solid #ddd; margin: 10px 0;">

            <h5>Component</h5>
            <div id="component-panel" >
            </div>
        </div>


        <div id="center-panel">
            <div class="drop-area" id="canvas"></div>
        </div>


        <div id="right-panel">
            <div class="form-group col-12">
                <button type="button" class="btn btn-default btn-sm d-none" id="previewBtn" onclick="preview()">
                    <i class="fas fa-eye"></i>Preview
                </button>
                <button type="button" class="btn btn-default btn-sm d-none" id="cancelPreviewBtn" onclick="cancelPreview()">
                    <i class="fas fa-undo"></i>Cancel
                </button>
                <button type="button" class="btn btn-default btn-sm" onclick="openPopupCode()">
                    <i class="fas fa-book"></i>Code
                </button>
                <button type="button" class="btn btn-default btn-sm" onclick="openPopupAction()">
                    <i class="fas fa-layer-group"></i>Action
                </button>
                <button type="button" class="btn btn-default btn-sm" onclick="save()">
                    <i class="fas fa-save"></i>Save
                </button>
            </div>

            <hr style="border: none; border-top: 1px solid #ddd; margin: 10px 0;">

            <h5>Option</h5>
            <div id="options">
                컴포넌트를 선택하세요
            </div>
        </div>
    </div>

    <script type="module" src="/ui/view-builder/builder/app.js"></script>
</div>
<script th:fragment="script">
    $( document ).ready(function() {
        togglePreviewBtn(true);

        App.modalPopup.receiveParam('OBJECT_RESULT',function(data){
            if(data.objectCode) {
                $("#objectCode").val(data.objectCode);
                $("#objectName").val(data.objectName);
                load();
            }
        });

        $('#objectCode').on('change', function() {
            loadObject($(this).val());
        });
    });

    function togglePreviewBtn(preview) {
        if(preview) {
            $("#previewBtn").removeClass('d-none');
            $("#cancelPreviewBtn").addClass('d-none');
        }
        else {
            $("#previewBtn").addClass('d-none');
            $("#cancelPreviewBtn").removeClass('d-none');
        }
    }

    function openPopupMenu() {
        App.modalPopup.open('/console/menu',{title:'메뉴 팝업',messageId:'MENU_REQUEST'});
    }

    function openPopupObject() {
        App.modalPopup.open('/console/view-object',{title:'오브젝트 팝업',messageId:'OBJECT_REQUEST'});
    }

    function openPopupAction() {
        let objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트를 입력해주세요');
            return;
        }

        App.modalPopup.open('/console/action',{title:'Action 팝업',messageId:'ACTION_REQUEST'},{objectCode:objectCode});
    }

    function openPopupCode() {
        let objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트를 입력해주세요');
            return;
        }

        App.modalPopup.open('/console/code',{title:'Code 팝업',messageId:'CODE_REQUEST'},{objectCode:objectCode});
    }

    function save() {
        const json = VB.builder.getViewData();

        const objectCode = $("#objectCode").val();

        if(!objectCode) {
            alert("오브젝트 코드를 입력해주세요.");
            return;
        }

        App.httpClient.post(`/console/api/object-content/upsert`,{},{
                objectCode:objectCode,
                content:JSON.stringify(json, null, 2)
            },
            function(response){
                alert("저장에성공하였습니다.");
            },
            function(error){
                alert("에러가 발생되었습니다.");
            }
        );
    }

    function loadObject(objectCode) {
        httpClient.get(`/console/api/object`, {objectCode:objectCode},
            function(response){
                if(response && response[0]){
                    $("#objectName").val(response[0].objectName);
                    load();
                }
                else {
                    $("#objectName").val("(없음)");
                }
            },
            function(error){
                alert('error');
            }
        );
    }


    function createObject() {
        let objectName = prompt("생성할 오브젝트명을 입력해주세요.");

        const objectCode = $("#objectCode").val();

        httpClient.post(`/console/api/object`,{},
            {
                objectCode: objectCode,
                objectName: objectName,
                type: 'VIEW_BUILDER',
                path: '-',
                useAuthValidation: "true",
                useAuthorityValidation: "true"
            },
            function(response){
                alert("생성되었습니다.");
                loadObject(objectCode);
            },
            function(error){
                alert('error');
            }
        );
    }

    function load() {
        const objectCode = $("#objectCode").val();

        if(!objectCode) {
            alert("오브젝트 코드를 입력해주세요.");
            return;
        }

        App.httpClient.get(`/console/api/object-content`,{objectCode:objectCode},
            function(response){
                if(response[0]) {
                    loadEditor(JSON.parse(response[0].content));
                }
                else {
                    alert('오브젝트가 존재하지않아 빈화면으로 셋팅됩니다.\n오브젝트를 생성 후 작업을 진행해주세요.');
                    loadEditor([]);
                }
            },
            function(error){
                alert("에러가 발생되었습니다.");
            }
        );
    }

    function loadEditor(data) {
        VB.builder.loadEditor(data);
    }

    function preview() {
        const objectCode = $("#objectCode").val();
        if(!objectCode) {
            alert('오브젝트를 입력해주세요');
            return;
        }

        togglePreviewBtn(false);
        VB.builder.preview(objectCode);
    }

    function cancelPreview() {
        togglePreviewBtn(true);
        VB.builder.cancelPreview();
    }

    function reload() {
        location.reload();
    }
</script>
