<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<script th:fragment="script">
    App.codes = {
        "YN_CD":[
            {code:"true",name:"Y"},
            {code:"false",name:"N"}
        ],
        "COLUMN_TYPE":[
            {code:"STRING",name:"String"},
            {code:"NUMBER",name:"Number"},
            {code:"DATE",name:"Date"},
            {code:"DATETIME",name:"Datetime"}
        ],
        "SELECT_WHERE_TYPE":[
            {code:"COMPARE_REQUIRED",name:"필수"},
            {code:"COMPARE_NOT_REQUIRED",name:"필수아님"}
        ],
        "SELECT_WHERE_COMPARE_OPERATOR":[
            {code:"=",name:"="},
            {code:"!=",name:"!="},
            {code:">",name:">"},
            {code:">=",name:">="},
            {code:"<",name:"<"},
            {code:"<=",name:"<="},
            {code:"like",name:"like"}
        ],
        "SORT_ORDER":[
            {code:"ASC",name:"오름차순"},
            {code:"DESC",name:"내림차순"}
        ],
        "NULL_RESOLVE_TYPE":[
            {code:"EXCEPTION",name:"예외처리"},
            {code:"SET_NULL",name:"null 셋팅"},
            {code:"EXCLUDE_QUERY",name:"제외"}
        ],
        "ENTITY_AUTO_VALUE_TYPE":[
            {code:"STATIC_VALUE",name:"static 값"},
            {code:"QUERY",name:"쿼리"},
            {code:"RESERVED_WORD",name:"예약어"}
        ]
    };

    let codes;
    let sqlEditor;
    let functionName;

    $( document ).ready(function() {
        init();
    });

    function init() {
        setDatSourceAsDatabase();

        Sheet.initSheet('entityColumnGrid', "100%", "400px",
            {
                useSeq:true,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'id', label:'ID', type:'text', width:20, editable: false, align:'left', required:false, hide:true},
                {field:'columnName', label:'컬럼', type:'text', width:250, editable: true, align:'left', required:true},
                {field:'displayName', label:'화면노출명', type:'text', width:250, editable: true, align:'left', required:true},
                {field:'useKey', label:'Key', type:'check', width:100, editable: true, align:'center', required:false},
                {field:'columnType', label:'타입', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['COLUMN_TYPE']},
                {field:'orderNum', label:'순서', type:'number', width:100, editable: true, align:'center', required:false}
            ]);

        Sheet.initSheet('selectQueryGrid', "100%", "400px",
            {
                useSeq:false,
                useStatus:false,
                useDelete:false,
                useExpendLastColumn:true
            },
            [
                {field:'columnName', label:'컬럼', type:'text', width:250, editable: false, align:'left', required:false},
                {field:'selectWhereType', label:'where 유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['SELECT_WHERE_TYPE']},
                {field:'selectWhereCompareOperator', label:'where 비교연산자', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['SELECT_WHERE_COMPARE_OPERATOR']},
                {field:'selectOrderByNum', label:'order by 순서', type:'number', width:200, editable: true, align:'center', required:false},
                {field:'selectOrderBySortOrder', label:'order by 정렬유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['SORT_ORDER']}
            ]);

        Sheet.initSheet('insertQueryGrid', "100%", "400px",
            {
                useSeq:false,
                useStatus:false,
                useDelete:false,
                useExpendLastColumn:true
            },
            [
                {field:'columnName', label:'컬럼', type:'text', width:250, editable: false, align:'left', required:false},
                {field:'insertNullResolveType', label:'null 처리유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['NULL_RESOLVE_TYPE']},
                {field:'insertAutoValueType', label:'자동값 유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['ENTITY_AUTO_VALUE_TYPE']},
                {field:'insertAutoValue', label:'자동값', type:'text', width:250, editable: true, align:'left', required:false}
            ]);

        Sheet.initSheet('updateQueryGrid', "100%", "400px",
            {
                useSeq:false,
                useStatus:false,
                useDelete:false,
                useExpendLastColumn:true
            },
            [
                {field:'columnName', label:'컬럼', type:'text', width:250, editable: false, align:'left', required:false},
                {field:'updateNullResolveType', label:'null 처리유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['NULL_RESOLVE_TYPE']},
                {field:'updateAutoValueType', label:'자동값 유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['ENTITY_AUTO_VALUE_TYPE']},
                {field:'updateAutoValue', label:'자동값', type:'text', width:250, editable: true, align:'left', required:false}
            ]);

        Sheet.initSheet('deleteQueryGrid', "100%", "400px",
            {
                useSeq:false,
                useStatus:false,
                useDelete:false,
                useExpendLastColumn:true
            },
            [
                {field:'columnName', label:'컬럼', type:'text', width:250, editable: false, align:'left', required:false},
                {field:'deleteAutoValueType', label:'자동값 유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['ENTITY_AUTO_VALUE_TYPE']},
                {field:'deleteAutoValue', label:'자동값', type:'text', width:250, editable: true, align:'left', required:false}
            ]);

        Sheet.initSheet('executeGrid', "100%", "250px",
            {
                useSeq:false,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'key', label:'파라미터', type:'text', width:400, editable: true, align:'left', required:false},
                {field:'value', label:'값', type:'text', width:400, editable: true, align:'left', required:false}
            ]);

        App.modalPopup.receiveParam('FUNC_REQUEST', function(data){
            if(!data.functionName) {
                alert('기능코드가 존재하지않습니다.');
            }

            functionName = data.functionName;
            getEntity(functionName)
        });
    }

    function newRowEntityColumnGrid() {
        entityColumnGrid.addRowData({
            columnName:"(컬럼)",
            displayName:"(화면노출명)",
            columnType:"STRING",
            orderNum:1
        });
    }

    function setDatSourceAsDatabase() {
        httpClient.get(`/console/api/datasource/database`, {},
            function(response){
                let codes = new Array();
                for(let i=0; i<response.length; i++) {
                    codes.push({code:response[i].dataSourceName,name:response[i].displayName});
                }

                App.util.setCodeBox("entity-dataSourceName", codes);
            },
            function(error){
                alert('error');
            }
        );
    }

    function execute() {
        alert('아직 지원하지않습니다.');
        return;

        let executeTarget = functionName;

        let contents = {};
        let gridData = grid.getSheetData("executeGrid");

        for(let i=0; i<gridData.length; i++) {
            let value = gridData[i]["value"];
            if(value == "null") {
                contents[gridData[i]["key"]] = null;
            }
            else {
                contents[gridData[i]["key"]] = value;
            }
        }

        httpClient.get(`/console/api/query/${executeTarget}/execute`,contents,
            function(response){
                $("#responseData").val(JSON.stringify(response,null,3));
            },
            function(error){
                $("#responseData").val(JSON.stringify(error.responseJSON,null,3));
            }
        );
    }

    function getEntity(entityName) {
        httpClient.get(`/console/api/entity`, {entityName:entityName},
            function(response){
                if(response[0]) {
                    setEntityContent(response[0]);
                }
                else {
                    newEntityContent(entityName);
                }
            },
            function(error){
                alert('error');
            }
        );
    }

    function getEntityContent() {
        return {
            id: $("#entity-id").val(),
            entityName: $("#entity-entityName").val(),
            displayName: $("#entity-displayName").val(),
            dataSourceName: $("#entity-dataSourceName").val(),
            tableName: $("#entity-tableName").val()
        }
    }

    function getEntityColumns() {
        const columns = entityColumnGrid.getSheetData();
        const selectQueryMap = getQuerySheetData(selectQueryGrid.getSheetData());
        const insertQueryMap = getQuerySheetData(insertQueryGrid.getSheetData());
        const updateQueryMap = getQuerySheetData(updateQueryGrid.getSheetData());
        const deleteQueryMap = getQuerySheetData(deleteQueryGrid.getSheetData());

        for(const col of columns) {
            const selectObj = selectQueryMap[col.columnName];
            if(selectObj) {
                for(let queryCol in selectObj) {
                    col[queryCol] = selectObj[queryCol];
                }
            }
            const insertObj = insertQueryMap[col.columnName];
            if(insertObj) {
                for(let queryCol in insertObj) {
                    col[queryCol] = insertObj[queryCol];
                }
            }
            const updateObj = updateQueryMap[col.columnName];
            if(updateObj) {
                for(let queryCol in updateObj) {
                    col[queryCol] = updateObj[queryCol];
                }
            }
            const deleteObj = deleteQueryMap[col.columnName];
            if(deleteObj) {
                for(let queryCol in deleteObj) {
                    col[queryCol] = deleteObj[queryCol];
                }
            }
        }

        return columns;
    }

    function getQuerySheetData(data) {
        return data.reduce((result, item) => {
            result[item.columnName] = item;
            return result;
        }, {});

    }

    function setEntityContent(params) {
        $("#entity-id").val(params.id);
        $("#entity-entityName").val(params.entityName);
        $("#entity-displayName").val(params.displayName);
        $("#entity-dataSourceName").val(params.dataSourceName);
        $("#entity-tableName").val(params.tableName);
        entityColumnGrid.setSheetData(params.entityColumns);
        selectQueryGrid.setSheetData(params.entityColumns);
        insertQueryGrid.setSheetData(params.entityColumns);
        updateQueryGrid.setSheetData(params.entityColumns);
        deleteQueryGrid.setSheetData(params.entityColumns);
      }

      function newEntityContent(entityName){
        setEntityContent({
            id:'',
            entityName:entityName,
            displayName:'',
            dataSourceName:'',
            tableName:'',
            entityColumns:[]
            });
      }

    function save() {
        httpClient.post(`/console/api/entity/save`,
            {},
            {
                'entity':getEntityContent(),
                'entityColumns':getEntityColumns()
            },
            function(response){
                alert("저장완료되었습니다.");
                getEntity($("#entity-entityName").val());
            },
            function(error){
                alert('error');
            }
        );
    }
</script>
<div th:fragment="view">
    <div class="card">
        <div class="card-header p-0 border-bottom-0">
            <ul class="nav nav-tabs" id="detail-tab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="workflow-def-tab" data-toggle="pill" href="#workflow-def" role="tab" aria-controls="workflow-def" aria-selected="true">
                        Definition
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="execute-tab" data-toggle="pill" href="#execute" role="tab" aria-controls="execute" aria-selected="false">
                        Execute
                    </a>
                </li>
            </ul>
        </div>
        <div class="card-body">
            <div class="tab-content" id="detail-tabContent" >

                <div class="tab-pane fade show active" id="workflow-def" role="tabpanel" aria-labelledby="workflow-def-tab">
                    <div class="card-body">
                        <div class="row">
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="save()" >
                                    <i class="btn-icon fas fa-save"></i>
                                    <span class="btn-label">Save</span>
                                </button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-1 d-none">
                                <label for="entity-id">ID</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="entity-id" autocomplete="off" >
                            </div>
                            <div class="form-group col-3">
                                <label for="entity-entityName">엔티티명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="entity-entityName" autocomplete="off" disabled>
                            </div>
                            <div class="form-group col-3">
                                <label for="entity-displayName">화면노출명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="entity-displayName" autocomplete="off">
                            </div>
                            <div class="form-group col-3">
                                <label for="entity-dataSourceName">데이터소스</label>
                                <select class="form-control form-control-sm" id="entity-dataSourceName" >
                                </select>
                            </div>
                            <div class="form-group col-2">
                                <label for="entity-tableName">테이블명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="entity-tableName" autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <div class="tab-content">
                        <div class="card-header p-0 border-bottom-0">
                            <ul class="nav nav-tabs" id="column-tab" role="tablist">
                                <li class="nav-item">
                                    <a class="nav-link active" id="column-def-tab" data-toggle="pill" href="#column-def" role="tab" aria-controls="column-def" aria-selected="true">
                                        컬럼
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" id="select-query-tab" data-toggle="pill" href="#select-query" role="tab" aria-controls="select-query" aria-selected="false">
                                        Select 쿼리
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" id="insert-query-tab" data-toggle="pill" href="#insert-query" role="tab" aria-controls="insert-query" aria-selected="false">
                                        Insert 쿼리
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" id="update-query-tab" data-toggle="pill" href="#update-query" role="tab" aria-controls="update-query" aria-selected="false">
                                        Update 쿼리
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" id="delete-query-tab" data-toggle="pill" href="#delete-query" role="tab" aria-controls="delete-query" aria-selected="false">
                                        Delete 쿼리
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <div class="tab-pane fade show active" id="column-def" role="tabpanel" aria-labelledby="column-def-tab">
                            <div class="row">
                                <div style=" display: flex; margin-left: auto;">
                                    <button type="button" class="btn btn-default btn-sm" onclick="newRowEntityColumnGrid()" >
                                        <i class="btn-icon fas fa-plus"></i>
                                        <span class="btn-label">Add</span>
                                    </button>
                                </div>
                                <div id="entityColumnGrid"></div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="select-query" role="tabpanel" aria-labelledby="select-query-tab">
                            <div class="row">
                                <div id="selectQueryGrid"></div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="insert-query" role="tabpanel" aria-labelledby="insert-query-tab">
                            <div class="row">
                                <div id="insertQueryGrid"></div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="update-query" role="tabpanel" aria-labelledby="update-query-tab">
                            <div class="row">
                                <div id="updateQueryGrid"></div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="delete-query" role="tabpanel" aria-labelledby="delete-query-tab">
                            <div class="row">
                                <div id="deleteQueryGrid"></div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="tab-pane fade" id="execute" role="tabpanel" aria-labelledby="execute-tab">
                    <div class="card-body">
                        <div class="row">
                            <label>SQL 파라미터</label>
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="executeGrid.addRowData()" >
                                    <i class="btn-icon fas fa-plus"></i>
                                    <span class="btn-label">Add</span>
                                </button>
                                <button type="button" class="btn btn-success btn-sm" onclick="execute()" >
                                    <i class="btn-icon fas fa-play"></i>
                                    <span class="btn-label">Run</span>
                                </button>
                            </div>
                            <div id="executeGrid"></div>
                        </div>
                        <div class="row">
                            <label>실행 결과</label>
                            <textarea class="col-12" id="responseData"  rows="15" ></textarea>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</html>
