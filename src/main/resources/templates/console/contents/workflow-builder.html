<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    /* ============ Full-height page shell ============ */
    /* adminlte.js의 fixLayoutHeight()가 로드 시 html/body에 인라인 height:auto를
       강제로 지정해버려서 일반 규칙으로는 무시된다. !important로 덮어써야 한다. */
    html, body {
        height: 100% !important;
        margin: 0;
    }

    .wrapper {
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .wrapper > div {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    /* ============ App shell ============ */
    .wf-app {
        display: flex;
        flex: 1;
        min-height: 0;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        background: #ffffff;
    }

    /* ============ Sidebar (workflow list) ============ */
    .wf-sidebar {
        width: 280px;
        flex: 0 0 280px;
        border-right: 1px solid #eef0f2;
        display: flex;
        flex-direction: column;
        background: #fbfbfc;
        margin-left: 0;
        transition: margin-left .18s ease;
        overflow: hidden;
    }

    .wf-sidebar.collapsed {
        margin-left: -280px;
    }

    .wf-sidebar-header {
        padding: 14px;
        border-bottom: 1px solid #eef0f2;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .btn-new-workflow {
        width: 100%;
        border: none;
        border-radius: 8px;
        background: #4A90E2;
        color: #fff;
        padding: 9px 12px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
    }

    .btn-new-workflow:hover {
        background: #3d7fce;
    }

    .wf-search {
        position: relative;
    }

    .wf-search input {
        width: 100%;
        padding: 6px 30px 6px 10px;
        border: 1px solid #d7dbe0;
        border-radius: 6px;
        font-size: 12.5px;
    }

    .wf-search i {
        position: absolute;
        right: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        cursor: pointer;
        font-size: 12px;
    }

    .wf-search i:hover {
        color: #4A90E2;
    }

    .wf-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
    }

    .wf-list-empty {
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
        padding: 24px 0;
    }

    .wf-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 4px;
    }

    .wf-list-item:hover {
        background: #f1f3f5;
    }

    .wf-list-item.active {
        background: #eef5ff;
    }

    .wf-list-item-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #eef1f4;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6b7280;
        flex: 0 0 30px;
        font-size: 12px;
    }

    .wf-list-item.active .wf-list-item-icon {
        background: #4A90E2;
        color: #fff;
    }

    .wf-list-item-info {
        min-width: 0;
    }

    .wf-list-item-name {
        font-size: 13.5px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .wf-list-item-code {
        font-size: 11.5px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ============ Main area ============ */
    .wf-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .wf-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid #eef0f2;
    }

    .wf-sidebar-toggle {
        border: none;
        background: transparent;
        color: #6b7280;
        font-size: 16px;
        cursor: pointer;
        padding: 4px 6px;
    }

    .wf-title-group {
        display: flex;
        gap: 6px;
        flex: 1;
        min-width: 0;
    }

    .wf-code-input, .wf-name-input {
        border: 1px solid transparent;
        background: transparent;
        border-radius: 6px;
        padding: 4px 8px;
    }

    .wf-code-input:hover, .wf-name-input:hover {
        border-color: #e5e7eb;
    }

    .wf-code-input:focus, .wf-name-input:focus {
        background: #f1f3f5;
        outline: none;
        border-color: #e5e7eb;
    }

    .wf-code-input {
        font-size: 12px;
        color: #9199a3;
        width: 160px;
    }

    .wf-name-input {
        font-size: 16px;
        font-weight: 600;
        color: #1f2937;
        flex: 1;
        min-width: 0;
    }

    .wf-topbar-actions {
        display: flex;
        gap: 6px;
        flex: 0 0 auto;
    }

    .wf-topbar-actions button {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
        color: #374151;
        white-space: nowrap;
    }

    .wf-topbar-actions button:hover {
        background: #f1f3f5;
    }

    .wf-topbar-actions button.btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    .wf-topbar-actions button.btn-primary:hover {
        background: #3d7fce;
    }

    .wf-topbar-actions button.btn-danger {
        color: #dc2626;
        border-color: #f3c9c9;
    }

    .wf-topbar-actions button.btn-danger:hover {
        background: #fef2f2;
    }

    /* ============ Canvas ============ */
    .wf-canvas-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
    }

    .wf-canvas {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        overflow: auto;
        background-color: #fafbfc;
        background-image: radial-gradient(circle, #d7dce3 1.2px, transparent 1.2px);
        background-size: 20px 20px;
        padding: 40px 0 60px 0;
    }

    /* 분기가 생기면 흐름은 좌우로도 넓어진다. 그리드는 내용만큼 넓어지되(fit-content)
       최소한 캔버스 폭은 차지하게 해서, 좁은 흐름은 가운데 정렬되고 넓은 흐름은 가로 스크롤된다. */
    #workflowGrid {
        position: relative;
        width: fit-content;
        min-width: 100%;
        margin: 0 auto;
        min-height: 100%;
    }

    #connectorLayer {
        overflow: visible;
    }

    /* ============ Chain / branch layout ============ */
    /* 체인(.wf-chain)은 위에서 아래로 이어지는 직선 흐름 한 줄이다.
       조건분기 노드는 자기 카드 아래에 조건 개수만큼의 가지 + else 가지를 품는다.
       체인 폭은 그릴 때 하위 분기 폭을 합산해서 px로 지정한다(chainWidth). */
    .wf-chain {
        position: relative;
        margin: 0 auto;
    }

    /* 드래그 대상은 카드가 아니라 이 래퍼다. 조건분기 노드를 옮기면 하위 분기가 통째로 따라간다.
       (카드 자체를 드래그 대상으로 두고 카드에 margin:auto를 주면, jQuery UI Sortable이
        드래그 중 카드를 position:absolute로 바꾸면서 auto 마진 오프셋을 잃어 카드가 왼쪽 끝으로 튄다.
        래퍼를 드래그 대상으로 두면 카드의 margin:auto는 건드려지지 않는다.) */
    .wf-node-wrap {
        position: relative;
        width: 100%;
    }

    .wf-branch-row {
        display: flex;
        align-items: flex-start;
        justify-content: center;
    }

    .wf-branch {
        position: relative;
    }

    .wf-branch-head {
        position: relative;
        /* 카드 왼쪽 드래그 핸들(26px) 때문에 카드 내용의 중심이 오른쪽으로 13px 치우쳐 있다.
           가지 머리도 같은 만큼 밀어야 화살표 축과 일직선이 된다. */
        left: 13px;
        width: fit-content;
        max-width: 100%;
        margin: 0 auto 24px auto;
        text-align: center;
    }

    .wf-branch-label {
        display: inline-block;
        padding: 3px 12px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
    }

    .wf-branch-label.is-case {
        background: #e0e7ff;
        color: #4338ca;
    }

    .wf-branch-label.is-else {
        background: #f1f3f5;
        color: #6b7280;
    }

    .wf-branch-expression {
        max-width: 280px;
        margin: 6px auto 0 auto;
        font-family: "Consolas", "Menlo", "Monaco", monospace;
        font-size: 11px;
        color: #4f46e5;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .wf-branch-expression.is-empty {
        color: #c0c4cc;
        font-family: inherit;
    }

    .workflow-item-placeholder {
        width: 300px;
        height: 90px;
        border: 2px dashed #4A90E2;
        background: #eef5ff;
        margin: 0 auto 40px auto;
        border-radius: 12px;
    }

    .step-item {
        position: relative;
        background-color: #ffffff;
        width: 300px;
        border-radius: 12px;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        font-size: 14px;
        border: 1px solid #e2e5ea;
        box-shadow: 0 1px 3px rgba(16, 24, 40, .07);
        margin: 0 auto 40px auto;
        word-break: break-word;
        overflow-wrap: break-word;
        cursor: pointer;
        /* 상세창 딤(.wf-drawer-backdrop, z-index:3)보다 위에 둔다. 딤보다 아래면
           상세창이 열린 상태에서 다른 노드를 클릭할 때 카드가 아니라 딤이 클릭을
           받아 상세창이 닫혀버려서, 노드를 바로 갈아타지 못한다.
           카드가 stacking context를 갖게 되므로 카드 안의 .step-tools는 카드 기준으로만
           쌓이지만, 카드 자체가 이미 딤 위에 있어 버튼 클릭도 정상 동작한다.
           상세창 패널(.wf-node-drawer, z-index:5)보다는 아래여야 패널을 가리지 않는다.
           화살표(svg)보다 위에 그려지는 건 DOM 순서로도 유지된다. */
        z-index: 4;
        transition: box-shadow .15s ease, border-color .15s ease;
    }

    .step-item:hover {
        box-shadow: 0 6px 16px rgba(16, 24, 40, .12);
    }

    .step-item.selected {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .18);
    }

    .step-item.step-item-condition {
        border-color: #c7ccfa;
    }

    .step-item.step-item-condition.selected {
        border-color: #6366F1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, .18);
    }

    /* ============ Drag handle (node move) ============ */
    .step-drag-handle {
        flex: 0 0 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafbfc;
        border-right: 1px solid #eef0f2;
        border-top-left-radius: 11px;
        border-bottom-left-radius: 11px;
        color: #c7cbd1;
        cursor: grab;
    }

    .step-drag-handle:hover {
        background: #eef5ff;
        color: #4A90E2;
    }

    .step-drag-handle:active {
        cursor: grabbing;
    }

    .step-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .add-step-item {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        border: 2px dashed #c7cbd1;
        color: #9199a3;
        cursor: pointer;
        margin: 0 auto;
        /* 카드와 같은 이유로 딤 위에 둔다 - 상세창이 열린 상태에서도 단계 추가가 가능해야 한다. */
        z-index: 4;
        /* step-item은 왼쪽에 26px 드래그 핸들이 있어 카드 내용 중심이 그만큼 오른쪽으로
           치우쳐 있다. + 버튼도 같은 만큼(핸들 폭의 절반) 오른쪽으로 밀어야
           화살표가 일직선으로 이어진다. */
        left: 13px;
        transition: all .15s ease;
    }

    .add-step-item:hover {
        border-color: #4A90E2;
        color: #4A90E2;
        background-color: #eef5ff;
    }

    .step-message {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 6px 16px;
    }

    .step-message-type {
        font-size: 10px;
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 12px;
    }

    .message-in {
        background-color: #bae6ff;
        color: #0369a1;
    }

    .message-out {
        background-color: #a8f0a0;
        color: #047857;
    }

    .step-message-id {
        font-weight: 500;
        font-size: 12px;
    }

    .step-function {
        flex: 1;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        padding: 14px 16px;
        gap: 12px;
        border-top: 1px solid #eef0f2;
        border-bottom: 1px solid #eef0f2;
        cursor: pointer;
    }

    /* 조건분기 카드는 OUT 줄이 없어 아래쪽 구분선이 카드 테두리와 겹쳐 보인다. */
    .step-item-condition .step-function {
        border-bottom: none;
    }

    .step-function-img {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .step-function-img img {
        border-radius: 8px;
    }

    .step-function-name {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .function-display-name {
        color: #1f2937;
        font-weight: 600;
        font-size: 15px;
    }

    .function-name {
        color: #8a94a6;
        font-weight: 400;
        font-size: 12px;
    }

    .function-name.condition-expression {
        font-family: "Consolas", "Menlo", "Monaco", monospace;
        font-size: 11.5px;
        color: #4f46e5;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .function-name.condition-expression.is-empty {
        color: #c0c4cc;
        font-family: inherit;
    }

    .step-tools {
        position: absolute;
        top: -34px;
        right: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 5px 9px;
        box-shadow: 0 2px 6px rgba(16, 24, 40, .12);
        opacity: 0;
        /* pointer-events는 항상 auto로 둬야 한다. 이 버튼은 카드 바깥(top:-34px)에
           떠 있어서 카드 박스와 버튼 박스 사이에 빈 틈이 있는데, hover일 때만
           auto로 바꾸면 마우스가 카드를 벗어나 버튼 쪽으로 이동하는 순간
           :hover가 풀리면서 pointer-events가 다시 none이 되어 버튼이 클릭은커녕
           자기 자신에 대한 hover조차 받을 수 없는(hit-test에서 제외되는) 상태에
           빠져 버려 클릭이 전혀 먹히지 않았다.
        */
        pointer-events: auto;
        transition: opacity .12s ease;
        /* 카드(.step-item, z-index:4) 안쪽 기준으로만 쌓인다. 카드가 이미 상세창 딤
           위에 있으므로 딤에 가려 클릭이 씹히지 않고, 상세창 패널(z-index:5)보다는
           카드 자체가 아래라 패널 내용을 덮지도 않는다. 여기 z-index는 같은 카드
           안의 형제(드래그 핸들/본문) 위로 올리는 용도다. */
        z-index: 1;
    }

    .step-item:hover .step-tools,
    .step-item.selected .step-tools,
    .step-tools:hover {
        opacity: 1;
    }

    .step-tool {
        cursor: pointer;
        color: #9199a3;
        font-size: 11px;
        padding: 2px 3px;
    }

    /* 상세설정과 삭제는 성격이 다른 동작이라 구분선으로 나눠 오클릭을 줄인다. */
    .step-tool-delete {
        border-left: 1px solid #e5e7eb;
        padding-left: 10px;
        margin-left: 2px;
    }

    /* 조건분기 노드에는 상세설정 버튼이 없어 삭제 버튼만 남으므로 구분선도 필요없다. */
    .step-item-condition .step-tool-delete {
        border-left: none;
        padding-left: 3px;
        margin-left: 0;
    }

    .step-tool-detail:hover {
        color: #4A90E2;
    }

    .step-tool-delete:hover {
        color: #dc2626;
    }

    /* ============ Function type chip ============ */
    .function-type-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: 1px solid #d7dbe0;
        border-radius: 8px;
        background: #fff;
        padding: 7px 10px;
        font-size: 13px;
        color: #1f2937;
        cursor: pointer;
    }

    .function-type-chip:hover {
        border-color: #4A90E2;
    }

    .function-type-chip img {
        border-radius: 4px;
    }

    .function-type-chip span[name="chip-name"] {
        flex: 1;
        text-align: left;
    }

    .function-type-chip i {
        font-size: 10px;
        color: #9199a3;
    }

    /* ============ Function type picker modal ============ */
    .function-type-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 60vh;
        overflow-y: auto;
    }

    .function-type-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        cursor: pointer;
        transition: all .12s ease;
    }

    .function-type-item:hover {
        border-color: #4A90E2;
        background-color: #f5f9ff;
    }

    .function-type-item.current {
        border-color: #4A90E2;
        background-color: #eef5ff;
    }

    .function-type-icon {
        flex: 0 0 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .function-type-icon img {
        border-radius: 6px;
    }

    .function-type-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
    }

    .function-type-name {
        font-size: 15px;
        font-weight: 600;
        color: #1f2937;
    }

    .function-type-code {
        font-size: 11px;
        font-weight: 400;
        color: #9199a3;
        margin-left: 6px;
    }

    .function-type-desc {
        font-size: 12.5px;
        color: #6b7280;
    }

    /* ============ Node detail drawer ============ */
    .wf-drawer-backdrop {
        position: absolute;
        top: 0; left: 0; right: 380px; bottom: 0;
        background: rgba(17, 24, 39, .06);
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s ease;
        z-index: 3;
    }

    .wf-drawer-backdrop.show {
        opacity: 1;
        pointer-events: auto;
    }

    .wf-node-drawer {
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 380px;
        background: #fff;
        border-left: 1px solid #e5e7eb;
        box-shadow: -6px 0 18px rgba(16, 24, 40, .08);
        transform: translateX(100%);
        transition: transform .18s ease;
        display: flex;
        flex-direction: column;
        z-index: 5;
    }

    .wf-node-drawer.open {
        transform: translateX(0);
    }

    .wf-drawer-header {
        display: flex;

<script th:fragment="script">
    App.codes = {
        "FUNCTION_TYPE": [
            {code: "SQL", name: "SQL", icon: "/dist/img/func-sql.png", description: "직접 작성한 SQL 쿼리를 실행합니다."},
            {code: "ENTITY", name: "Entity", icon: "/dist/img/func-entity.png", description: "등록된 엔티티 정의를 기준으로 데이터를 조회·등록·수정·삭제합니다."},
            {code: "REST_CLIENT", name: "Rest Client", icon: "/dist/img/func-restclient.png", description: "등록된 외부 REST 서버를 호출하여 연동합니다."},
            {code: "MESSAGE_PROCESSOR", name: "메시지처리", icon: "/dist/img/func-message.png", description: "스크립트로 요청/응답 메시지를 가공하고 변환합니다."},
            {code: "NOTIFICATION", name: "알림", icon: "/dist/img/func-notification.png", description: "이메일 등 채널로 알림을 발송합니다."},
            {code: "CONDITION", name: "조건분기 (IF)", icon: "/dist/img/func-condition.svg", description: "if / else if / else 로 흐름을 여러 갈래로 나눕니다."}
        ]
    };

    const STEP_ITEM_ID_PREFIX = 'step-item-';
    const CONDITION_TYPE = 'CONDITION';
    const BRANCH_ELSE = 'ELSE';               // else 가지를 가리키는 branchId 자리값
    const EDGE_DEFAULT = 'DEFAULT';
    const EDGE_CASE = 'CASE';
    const EDGE_ELSE = 'ELSE';
    const NODE_WIDTH = 300;   // .step-item 폭
    const BRANCH_GAP = 48;    // 가지 사이 간격

    let workflowListData = [];
    let selectedWorkflowId = null;
    let activeNodeId = null;
    let authorityCodesMaster = [];
    let currentAuthorityList = [];
    let executeRows = [];
    let executeRowSeq = 0;

    /* ================= Workflow graph model =================
       노드는 nodeId로 식별하고 흐름은 트리로 들고 있는다.
       - nodeMap   : nodeId -> 노드 데이터
       - rootChain : 시작 노드부터 이어지는 직선 흐름(nodeId 배열)
       - 조건분기 노드는 conditions(if, else if ... 순서)와 branches(branchId -> 체인)를 가진다.
         branches 에는 조건별 가지와 else 가지(BRANCH_ELSE)가 들어있다.
       저장할 때 이 트리를 노드 + 조건 + 연결정보로 펼쳐서 보낸다. */
    let nodeMap = new Map();
    let rootChain = [];
    let nodeIdSeq = 0;
    let dragSnapshot = null;

    $( document ).ready(function() {
        init();

        let connectorResizeTimer = null;
        $(window).on('resize', function() {
            clearTimeout(connectorResizeTimer);
            connectorResizeTimer = setTimeout(drawConnectors, 100);
        });

        $(document).on("click", "#drawerTypeChip", function() {
            changeActiveNodeFunctionType();
        });
    });

    function init() {
        getWorkflowList();
        setAuthorityCodesMaster();
        newContent();
    }

    /* ================= Workflow list (left sidebar) ================= */

    function getWorkflowList() {
        httpClient.get(`/console/api/workflow`, {},
            function(response){
                workflowListData = response;
                renderWorkflowList();
            },
            function(error){
                alert('조회하는데 실패하였습니다.');
            }
        );
    }

    function renderWorkflowList() {
        const keyword = ($("#workflowSearch").val() || '').toLowerCase();
        const $list = $("#workflowList");
        $list.empty();

        const filtered = workflowListData.filter(w =>
            !keyword ||
            (w.workflowCode || '').toLowerCase().includes(keyword) ||
            (w.displayName || '').toLowerCase().includes(keyword)
        );

        if (filtered.length === 0) {
            $list.append(`<div class="wf-list-empty">워크플로우가 없습니다.</div>`);
            return;
        }

        for (const w of filtered) {
            const $item = $(`
                <div class="wf-list-item ${w.id === selectedWorkflowId ? 'active' : ''}">
                    <span class="wf-list-item-icon"><i class="fas fa-project-diagram"></i></span>
                    <span class="wf-list-item-info">
                        <div class="wf-list-item-name">${w.displayName || '(이름없음)'}</div>
                        <div class="wf-list-item-code">${w.workflowCode || ''}</div>
                    </span>
                </div>
            `);

            $item.on('click', function() {
                selectedContent(w.id);
            });

            $list.append($item);
        }
    }

    function toggleSidebar() {
        $("#wfSidebar").toggleClass('collapsed');
        setTimeout(drawConnectors, 200); // 사이드바 접기/펼치기 트랜지션(.18s) 종료 후 화살표 재계산
    }

    /* ================= Workflow CRUD ================= */

    function save() {
        const graph = collectWorkflowGraph();

        httpClient.post(`/console/api/workflow/save`,{},
            {
                workflow:getContent(),
                workflowFunctions:graph.functions,
                workflowEdges:graph.edges,
                workflowConditions:graph.conditions,
                workflowAuthority:currentAuthorityList
            },
            function(response){
                alert("저장 완료되었습니다.");
                getWorkflowList();
                selectedContent(response.id);
            },
            function(error){
                alert("에러 발생하였습니다.");
            }
        );
    }

    // 트리로 들고 있던 흐름을 노드 + 조건 + 연결정보로 펼친다.
    // 체인 안에서는 앞 노드 -> 뒤 노드를 DEFAULT로, 조건분기는 자기 노드 -> 가지 첫 노드를 CASE/ELSE로 잇는다.
    function collectWorkflowGraph() {
        const functions = [];
        const edges = [];
        const conditions = [];
        let orderNum = 0;

        function walk(chain, parentNodeId, branchType, branchId) {
            let prevNodeId = null;

            for (const nodeId of chain) {
                const node = getNode(nodeId);
                if (!node) continue;

                functions.push({
                    nodeId: node.nodeId,
                    functionName: node.functionName || '',
                    functionType: node.functionType,
                    orderNum: ++orderNum,
                    isLogging: node.isLogging === true,
                    requestMessageId: node.requestMessageId || '',
                    responseMessageId: node.responseMessageId || ''
                });

                if (prevNodeId) {
                    edges.push({sourceNodeId: prevNodeId, targetNodeId: nodeId, branchType: EDGE_DEFAULT, branchId: null, orderNum: edges.length});
                }
                else if (parentNodeId) {
                    edges.push({sourceNodeId: parentNodeId, targetNodeId: nodeId, branchType: branchType, branchId: branchId, orderNum: edges.length});
                }

                if (isConditionNode(node)) {
                    node.conditions.forEach(function(condition, index) {
                        conditions.push({
                            nodeId: nodeId,
                            branchId: condition.branchId,
                            conditionExpression: condition.conditionExpression || '',
                            orderNum: index
                        });

                        walk(branchOf(node, condition.branchId), nodeId, EDGE_CASE, condition.branchId);
                    });

                    walk(branchOf(node, BRANCH_ELSE), nodeId, EDGE_ELSE, null);
                }

                prevNodeId = nodeId;
            }
        }

        walk(rootChain, null, null, null);

        return {functions:functions, edges:edges, conditions:conditions};
    }

    function deleteWorkflow() {
        if(!confirm("삭제하시겠습니까?")) {
            return;
        }

        let id = $("#workflowId").val();

        httpClient.delete(`/console/api/workflow/${id}`, {},
          function(response){
              alert("삭제 처리 완료되었습니다.");
              getWorkflowList();
              newContent();
          },
          function(error){
              alert('error');
          }
        );
    }

    function selectedContent(workflowId) {
        httpClient.get(`/console/api/workflow/${workflowId}`, {},
            function(response){
                selectedWorkflowId = response.id;
                setContentData(response);
                loadWorkflowGraph(workflowId);
                getWorkflowAuthority(workflowId);
                initExecuteGrid();
                renderWorkflowList();
            },
            function(error){
                alert('error');
            }
        );
    }

    function setContentData(response) {
        setContent({
            id:response.id,
            workflowCode:response.workflowCode,
            displayName:response.displayName,
            useAuthValidation:response.useAuthValidation
          });
    }

    function getContent() {
        return {
            id: $("#workflowId").val(),
            workflowCode: $("#workflowCode").val(),
            displayName: $("#displayName").val(),
            note: '',
            useAuthValidation:App.util.isCheck('useAuthValidation')
        }
    }

    function setContent(params) {
        $("#workflowId").val(params.id);
        $("#workflowCode").val(params.workflowCode);
        $("#displayName").val(params.displayName);
        App.util.check('useAuthValidation', params.useAuthValidation);
    }

    function newContent(){
        selectedWorkflowId = null;

        setContent({
            id:'',
            workflowCode:'',
            displayName:'',
            useAuthValidation:true
            });

        buildModel([], [], []);
        renderWorkflow();

        currentAuthorityList = [];
        renderAuthorityChips();
        initExecuteGrid();
        renderWorkflowList();
    }

    function restore() {
        const workflowId = $("#workflowId").val();
        if(workflowId) {
            selectedContent(workflowId);
        }
        else {
            newContent();
        }
    }

    /* ================= Settings (auth / authority) ================= */

    function setAuthorityCodesMaster() {
        httpClient.get(`/console/api/authority`, {},
            function(response){
                authorityCodesMaster = response;
                renderAuthorityChips();
            },
            function(error){
                alert('error');
            }
        );
    }

    function getWorkflowAuthority(workflowId) {
        httpClient.get(`/console/api/workflow-authority`, {workflowId:workflowId},
            function(response){
                currentAuthorityList = response.map(r => ({authorityCode:r.authorityCode}));
                renderAuthorityChips();
            },
            function(error){
                alert('error');
            }
        );
    }

    function renderAuthorityChips() {
        const $chips = $("#authorityChips");
        $chips.empty();

        if (currentAuthorityList.length === 0) {
            $chips.append(`<span class="wf-chip-empty">등록된 권한이 없습니다.</span>`);
        }

        for (const item of currentAuthorityList) {
            const master = authorityCodesMaster.find(a => a.code === item.authorityCode);
            const label = master ? master.name : item.authorityCode;

            const $chip = $(`
                <span class="wf-authority-chip">${label} <i class="fas fa-times"></i></span>
            `);

            $chip.find('i').on('click', function() {
                removeAuthorityChip(item.authorityCode);
            });

            $chips.append($chip);
        }

        const $select = $("#authoritySelect");
        $select.empty().append(`<option value="">권한 추가...</option>`);
        for (const a of authorityCodesMaster) {
            if (!currentAuthorityList.some(item => item.authorityCode === a.code)) {
                $select.append(`<option value="${a.code}">${a.name}</option>`);
            }
        }
    }

    function addAuthorityChip() {
        const code = $("#authoritySelect").val();
        if (!code) return;

        currentAuthorityList.push({authorityCode:code});
        renderAuthorityChips();
    }

    function removeAuthorityChip(code) {
        currentAuthorityList = currentAuthorityList.filter(item => item.authorityCode !== code);
        renderAuthorityChips();
    }

    function openSettingsModal() {
        renderAuthorityChips();
        $('#settingsModal').modal('show');
    }

    /* ================= Execute ================= */

    function initExecuteGrid() {
        executeRows = [];
        executeRowSeq = 0;
        $("#responseData").val('');
        renderExecuteRows();
    }

    function renderExecuteRows() {
        const $rows = $("#executeRows");
        $rows.empty();

        for (const row of executeRows) {
            const $row = $(`
                <div class="wf-execute-row">
                    <input type="text" class="form-control form-control-sm" placeholder="메시지ID">
                    <input type="text" class="form-control form-control-sm" placeholder="컬럼">
                    <input type="text" class="form-control form-control-sm" placeholder="값">
                    <i class="fas fa-times wf-execute-row-remove"></i>
                </div>
            `);

            const $inputs = $row.find('input');
            $inputs.eq(0).val(row.messageId).on('input', function(){ row.messageId = this.value; });
            $inputs.eq(1).val(row.key).on('input', function(){ row.key = this.value; });
            $inputs.eq(2).val(row.value).on('input', function(){ row.value = this.value; });

            $row.find('.wf-execute-row-remove').on('click', function() {
                executeRows = executeRows.filter(r => r.seq !== row.seq);
                renderExecuteRows();
            });

            $rows.append($row);
        }
    }

    function addExecuteRow() {
        executeRows.push({seq:++executeRowSeq, messageId:'', key:'', value:''});
        renderExecuteRows();
    }

    function execute() {
        const body = executeRows.reduce((result, item) => {
            if (!item.messageId) return result;

            if (!result[item.messageId]) {
                result[item.messageId] = [];
            }
            result[item.messageId].push({messageId:item.messageId, key:item.key, value:item.value});
            return result;
        }, {});

        let header = {workflowCode : $("#workflowCode").val()};

        httpClient.post(`/workflow`,{},{body:body,header:header},
            function(response){
                $("#responseData").val(JSON.stringify(response,null,3));
            },
            function(error){
                $("#responseData").val(JSON.stringify(error.responseJSON,null,3));
            }
        );
    }

    function openExecuteModal() {
        $('#executeModal').modal('show');
    }

    function copyExecuteResult() {
        const text = $("#responseData").val();
        if (!text) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
        } else {
            const $textarea = $("#responseData");
            $textarea.trigger('select');
            document.execCommand('copy');
        }
    }

    /* ================= Graph model ================= */

    function getNode(nodeId) {
        return nodeMap.get(nodeId);
    }

    function isConditionNode(node) {
        return !!node && node.functionType === CONDITION_TYPE;
    }

    function createNodeId() {
        return 'node-' + (++nodeIdSeq);
    }

    // 조건 가지들(판정 순서) + 마지막 else 가지.
    function branchIds(node) {
        return node.conditions.map(condition => condition.branchId).concat([BRANCH_ELSE]);
    }

    function branchOf(node, branchId) {
        if (!node.branches[branchId]) {
            node.branches[branchId] = [];
        }

        return node.branches[branchId];
    }

    function setBranch(node, branchId, chain) {
        node.branches[branchId] = chain;
    }

    function branchLabel(branchId, index) {
        if (branchId === BRANCH_ELSE) return 'else';
        return index === 0 ? 'if' : 'else if';
    }

    // branchId 는 한 노드 안에서만 유일하면 된다. 조건을 지웠다 다시 추가해도 겹치지 않게 최대값 다음을 쓴다.
    function createBranchId(node) {
        let max = 0;

        for (const condition of node.conditions) {
            const matched = /^c(\d+)$/.exec(condition.branchId);
            if (matched) {
                max = Math.max(max, Number(matched[1]));
            }
        }

        return 'c' + (max + 1);
    }

    function createNode(nodeId, functionType) {
        const node = {
            nodeId: nodeId,
            functionType: functionType,
            functionName: '',
            displayName: functionType === CONDITION_TYPE ? '조건분기' : '(기능생성필요)',
            isLogging: false,
            requestMessageId: '',
            responseMessageId: '',
            conditions: [],
            branches: {}
        };

        if (functionType === CONDITION_TYPE) {
            resetConditions(node);
        }

        return node;
    }

    // 조건분기로 만들 때는 조건 하나(if)와 else 가지로 시작한다.
    function resetConditions(node) {
        node.conditions = [{branchId:'c1', conditionExpression:''}];
        node.branches = {c1:[], ELSE:[]};
    }

    function loadWorkflowGraph(workflowId) {
        httpClient.get(`/console/api/workflow-function`, {workflowId:workflowId},
            function(functions){
                httpClient.get(`/console/api/workflow-edge`, {workflowId:workflowId},
                    function(edges){
                        httpClient.get(`/console/api/workflow-condition`, {workflowId:workflowId},
                            function(conditions){
                                buildModel(functions, edges, conditions);
                                renderWorkflow();
                            },
                            function(error){
                                alert('error');
                            }
                        );
                    },
                    function(error){
                        alert('error');
                    }
                );
            },
            function(error){
                alert('error');
            }
        );
    }

    // 서버에서 받은 노드 + 조건 + 연결정보를 화면이 쓰는 트리로 되돌린다.
    // 연결정보가 하나도 없는(조건분기 도입 전) 워크플로우는 서버 실행 로직과 동일하게 orderNum 직선 흐름으로 본다.
    function buildModel(functions, edges, conditions) {
        nodeMap = new Map();
        rootChain = [];
        nodeIdSeq = 0;
        activeNodeId = null;

        const ordered = (functions || []).slice().sort((a, b) => (a.orderNum || 0) - (b.orderNum || 0));

        for (const f of ordered) {
            const nodeId = f.nodeId || createNodeId();

            const node = createNode(nodeId, f.functionType);
            node.functionName = f.functionName || '';
            node.displayName = f.displayName || '';
            node.isLogging = f.isLogging === true;
            node.requestMessageId = f.requestMessageId || '';
            node.responseMessageId = f.responseMessageId || '';
            node.conditions = [];
            node.branches = {};

            nodeMap.set(nodeId, node);

            const matched = /^node-(\d+)$/.exec(nodeId);
            if (matched) {
                nodeIdSeq = Math.max(nodeIdSeq, Number(matched[1]));
            }
        }

        const orderedConditions = (conditions || []).slice().sort((a, b) => (a.orderNum || 0) - (b.orderNum || 0));

        for (const c of orderedConditions) {
            const node = getNode(c.nodeId);
            if (!node) continue;

            node.conditions.push({branchId:c.branchId, conditionExpression:c.conditionExpression || ''});
        }

        // 조건분기 노드는 조건이 최소 한 개는 있어야 화면에 가지를 그릴 수 있다.
        for (const node of nodeMap.values()) {
            if (isConditionNode(node) && node.conditions.length === 0) {
                resetConditions(node);
            }
        }

        const outgoing = {};
        const targetNodeIds = new Set();

        for (const e of (edges || [])) {
            if (!nodeMap.has(e.sourceNodeId) || !nodeMap.has(e.targetNodeId)) continue;

            if (!outgoing[e.sourceNodeId]) {
                outgoing[e.sourceNodeId] = {cases:{}};
            }

            const out = outgoing[e.sourceNodeId];
            const branchType = e.branchType || EDGE_DEFAULT;

            if (branchType === EDGE_CASE) {
                out.cases[e.branchId] = e.targetNodeId;
            }
            else if (branchType === EDGE_ELSE) {
                out.elseTarget = e.targetNodeId;
            }
            else {
                out.defaultTarget = e.targetNodeId;
            }

            targetNodeIds.add(e.targetNodeId);
        }

        const visited = new Set();

        function buildChain(startNodeId) {
            const chain = [];
            let nodeId = startNodeId;

            while (nodeId && nodeMap.has(nodeId) && !visited.has(nodeId)) {
                visited.add(nodeId);
                chain.push(nodeId);

                const node = getNode(nodeId);
                const out = outgoing[nodeId] || {cases:{}};

                if (isConditionNode(node)) {
                    for (const condition of node.conditions) {
                        node.branches[condition.branchId] = buildChain(out.cases[condition.branchId]);
                    }
                    node.branches[BRANCH_ELSE] = buildChain(out.elseTarget);
                    nodeId = null;
                }
                else {
                    nodeId = out.defaultTarget;
                }
            }

            return chain;
        }

        const startNodeId = ordered.map(f => f.nodeId).find(nodeId => nodeMap.has(nodeId) && !targetNodeIds.has(nodeId));
        rootChain = buildChain(startNodeId);

        // 어느 흐름에도 연결되지 않은 노드가 남으면 조용히 사라지지 않도록 뒤에 이어붙인다.
        for (const nodeId of nodeMap.keys()) {
            if (!visited.has(nodeId)) {
                visited.add(nodeId);
                rootChain.push(nodeId);
            }
        }
    }

    // 드래그로 DOM 순서가 바뀐 뒤, DOM을 읽어 트리를 다시 맞춘다.
    function syncModelFromDom() {
        $("#workflowGrid .wf-chain").each(function() {
            const $chain = $(this);

            const nodeIds = $chain.children('.wf-node-wrap').map(function() {
                return $(this).attr('data-node-id');
            }).get();

            const parentNodeId = $chain.attr('data-parent-node-id');

            if (!parentNodeId) {
                rootChain = nodeIds;
            }
            else {
                const parent = getNode(parentNodeId);
                if (parent) {
                    setBranch(parent, $chain.attr('data-branch-id'), nodeIds);
                }
            }
        });
    }

    // 조건분기 노드는 흐름을 여러 갈래로 가르기 때문에 그 뒤에 노드가 더 붙으면 갈 길이 없어진다.
    // 조건분기는 항상 자기 체인의 마지막이어야 한다.
    function validateChains() {
        let valid = true;

        function check(chain) {
            chain.forEach(function(nodeId, index) {
                const node = getNode(nodeId);
                if (!isConditionNode(node)) return;

                if (index !== chain.length - 1) {
                    valid = false;
                }

                eachBranchChain(node, check);
            });
        }

        check(rootChain);

        return valid;
    }

    function eachBranchChain(node, callback) {
        for (const branchId of branchIds(node)) {
            callback(branchOf(node, branchId), branchId);
        }
    }

    function createModelSnapshot() {
        const nodes = [];
        for (const node of nodeMap.values()) {
            nodes.push(JSON.parse(JSON.stringify(node)));
        }

        return {nodes:nodes, rootChain:rootChain.slice()};
    }

    function restoreModelSnapshot(snapshot) {
        if (!snapshot) return;

        nodeMap = new Map();
        for (const node of snapshot.nodes) {
            nodeMap.set(node.nodeId, node);
        }
        rootChain = snapshot.rootChain.slice();
    }

    /* ================= Canvas rendering ================= */

    function renderWorkflow() {
        const $grid = $("#workflowGrid");

        $grid.empty();
        closeNodeDrawer();

        // 화살표 svg를 카드보다 먼저 넣어야(DOM 순서상 아래) 카드가 화살표 위에 그려진다.
        $grid.append(renderConnectLine());
        $grid.append(renderChain(rootChain, null, null));

        setChainSortable();
        drawConnectors();
    }

    function renderChain(chain, parentNodeId, branchId) {
        const $chain = $(`<div class="wf-chain"></div>`);
        $chain.attr('data-parent-node-id', parentNodeId || '');
        $chain.attr('data-branch-id', branchId || '');
        $chain.css('width', chainWidth(chain) + 'px');

        for (const nodeId of chain) {
            $chain.append(renderNodeWrap(nodeId));
        }

        // 조건분기로 끝나는 체인은 여기서 더 이어지지 않고 각 가지로 흐름이 넘어간다.
        const lastNode = chain.length > 0 ? getNode(chain[chain.length - 1]) : null;
        if (!isConditionNode(lastNode)) {
            $chain.append(renderAddStepItem(parentNodeId, branchId));
        }

        return $chain;
    }

    function renderNodeWrap(nodeId) {
        const node = getNode(nodeId);

        const $wrap = $(`<div class="wf-node-wrap"></div>`);
        $wrap.attr('data-node-id', nodeId);
        $wrap.append(renderStepItem(nodeId, node));

        if (isConditionNode(node)) {
            $wrap.append(renderBranchRow(node));
        }

        return $wrap;
    }

    function renderBranchRow(node) {
        const $row = $(`<div class="wf-branch-row"></div>`);
        $row.css('gap', BRANCH_GAP + 'px');

        branchIds(node).forEach(function(branchId, index) {
            $row.append(renderBranch(node, branchId, index));
        });

        return $row;
    }

    function renderBranch(node, branchId, index) {
        const chain = branchOf(node, branchId);
        const isElse = branchId === BRANCH_ELSE;

        const $branch = $(`<div class="wf-branch"></div>`);
        $branch.attr('data-branch-id', branchId);
        $branch.css('width', chainWidth(chain) + 'px');

        const $head = $(`<div class="wf-branch-head"></div>`);
        $head.append(`<span class="wf-branch-label ${isElse ? 'is-else' : 'is-case'}">${branchLabel(branchId, index)}</span>`);

        if (!isElse) {
            const expression = node.conditions[index] ? node.conditions[index].conditionExpression : '';

            $head.append($(`<div class="wf-branch-expression"></div>`)
                .attr('data-node-id', node.nodeId)
                .attr('data-branch-id', branchId)
                .toggleClass('is-empty', !expression)
                .text(expression || '조건식 없음'));
        }

        $branch.append($head);
        $branch.append(renderChain(chain, node.nodeId, branchId));

        return $branch;
    }

    // 체인 폭 = 그 안의 조건분기가 좌우로 벌어지는 폭까지 감안한 폭.
    // 이 값을 px로 박아둬야 가지끼리 겹치지 않고 캔버스도 필요한 만큼만 넓어진다.
    function chainWidth(chain) {
        let width = NODE_WIDTH;

        for (const nodeId of chain) {
            const node = getNode(nodeId);
            if (!isConditionNode(node)) continue;

            const ids = branchIds(node);
            let branchesWidth = BRANCH_GAP * (ids.length - 1);

            for (const branchId of ids) {
                branchesWidth += chainWidth(branchOf(node, branchId));
            }

            width = Math.max(width, branchesWidth);
        }

        return width;
    }

    function renderAddStepItem(parentNodeId, branchId) {
        const $add = $(`
            <div class="add-step-item" title="단계 추가">
                <i class="fas fa-plus"></i>
            </div>
        `);

        $add.on('click', function() {
            addStepItem(parentNodeId, branchId);
        });

        return $add;
    }

    function renderConnectLine() {
        return $(`
            <svg id="connectorLayer" width="100%" height="100%" style="position:absolute; top:0; left:0; pointer-events:none;">
                <defs>
                    <!-- orient="auto"는 화살표 도형이 오른쪽(+x)을 향해 그려져 있다고 가정하고
                         경로 진행 방향 각도만큼 회전시킨다. 세로선(아래 방향, 90도 회전)에
                         맞춰 화살표를 아래쪽을 향하도록 그려두면 회전이 90도 더 들어가
                         옆으로 돌아간 것처럼(끝부분이 찌그러진 것처럼) 보이는 문제가 있었다.
                         그래서 화살표를 오른쪽을 향하도록 그려서 orient="auto"가 올바르게
                         회전시키도록 수정했다. -->
                    <marker id="connectorArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                        <path d="M0,0 L0,8 L7,4 Z" fill="#c7cbd1"></path>
                    </marker>
                </defs>
            </svg>
        `);
    }

    function renderStepItem(nodeId, node) {
        const stepItemEl = isConditionNode(node)
            ? renderConditionStepItem(nodeId, node)
            : renderFunctionStepItem(nodeId, node);

        stepItemEl.find('.step-tool-detail').on('click', function(e) {
            e.stopPropagation();

            const d = getNode(nodeId);
            if (d) openPopupFunctionSetting(d.functionType, d.functionName);
        });

        stepItemEl.find('.step-tool-delete').on('click', function(e) {
            e.stopPropagation();
            deleteNode(nodeId);
        });

        stepItemEl.on('click', function() {
            openNodeDrawer(nodeId);
        });

        return stepItemEl;
    }

    function renderFunctionStepItem(nodeId, node) {
        return $(`
            <div class="step-item" id="${STEP_ITEM_ID_PREFIX}${nodeId}">
                <div class="step-drag-handle" title="드래그하여 순서 이동"><i class="fas fa-grip-vertical"></i></div>
                <div class="step-body">
                    <div class="step-message">
                        <span class="step-message-type message-in">IN</span>
                        <span class="step-message-id" name="view-requestMessageId">${escapeHtml(node.requestMessageId)}</span>
                    </div>
                    <div class="step-function">
                        <span class="step-function-img">
                            <img name="view-functionType" src="${getFunctionIconPath(node.functionType)}" width="44" height="44" style="display:block;">
                        </span>
                        <span class="step-function-name">
                            <font class="function-display-name" name="view-displayName">${escapeHtml(node.displayName)}</font>
                            <font class="function-name" name="view-functionName">${escapeHtml(node.functionName)}</font>
                        </span>
                    </div>
                    <div class="step-message">
                        <span class="step-message-type message-out">OUT</span>
                        <span class="step-message-id" name="view-responseMessageId">${escapeHtml(node.responseMessageId)}</span>
                    </div>
                </div>
                <span class="step-tools">
                    <i class="step-tool step-tool-detail fas fa-sliders-h" title="상세 설정"></i>
                    <i class="step-tool step-tool-delete fas fa-trash" title="삭제"></i>
                </span>
            </div>
        `);
    }

    // 조건분기 노드는 내보낼 메시지가 없어 OUT 줄이 없고, 따로 만들어둘 기능도 없어 상세설정 버튼도 없다.
    function renderConditionStepItem(nodeId, node) {
        return $(`
            <div class="step-item step-item-condition" id="${STEP_ITEM_ID_PREFIX}${nodeId}">
                <div class="step-drag-handle" title="드래그하여 순서 이동"><i class="fas fa-grip-vertical"></i></div>
                <div class="step-body">
                    <div class="step-message">
                        <span class="step-message-type message-in">IN</span>
                        <span class="step-message-id" name="view-requestMessageId">${escapeHtml(node.requestMessageId)}</span>
                    </div>
                    <div class="step-function">
                        <span class="step-function-img">
                            <img name="view-functionType" src="${getFunctionIconPath(node.functionType)}" width="30" height="30" style="display:block;">
                        </span>
                        <span class="step-function-name">
                            <font class="function-display-name">조건분기</font>
                        </span>
                    </div>
                </div>
                <span class="step-tools">
                    <i class="step-tool step-tool-delete fas fa-trash" title="삭제"></i>
                </span>
            </div>
        `);
    }

    function hasConditionExpression(node) {
        return node.conditions.length > 0 && !!node.conditions[0].conditionExpression;
    }

    // 카드에는 첫 조건식만 보여주고, else if 가 더 있으면 개수로 알려준다.
    function conditionSummary(node) {
        if (!hasConditionExpression(node)) {
            return '조건식을 입력하세요';
        }

        const first = node.conditions[0].conditionExpression;

        return node.conditions.length > 1 ? `${first} 외 ${node.conditions.length - 1}개` : first;
    }

    function escapeHtml(text) {
        return $('<div></div>').text(text == null ? '' : text).html();
    }

    // 상세창에서 값을 바꿀 때마다 전체를 다시 그리면 입력 포커스가 끊기므로 카드 표시만 갱신한다.
    function updateStepItemView(nodeId) {
        const node = getNode(nodeId);
        if (!node) return;

        const $item = $(`#${STEP_ITEM_ID_PREFIX}${nodeId}`);

        $item.find(`[name="view-requestMessageId"]`).text(node.requestMessageId || '');
        $item.find(`[name="view-responseMessageId"]`).text(node.responseMessageId || '');
        $item.find(`[name="view-functionName"]`).text(node.functionName || '');
        $item.find(`[name="view-displayName"]`).text(node.displayName || '');
        $item.find(`[name="view-functionType"]`).attr('src', getFunctionIconPath(node.functionType));

        if (isConditionNode(node)) {
            $item.find(`[name="view-conditionSummary"]`)
                .text(conditionSummary(node))
                .toggleClass('is-empty', !hasConditionExpression(node));
        }
    }

    function updateBranchExpressionView(nodeId, branchId, expression) {
        $(`.wf-branch-expression[data-node-id="${nodeId}"][data-branch-id="${branchId}"]`)
            .text(expression || '조건식 없음')
            .toggleClass('is-empty', !expression);
    }

    function getFunctionTypeInfo(functionType) {
        return App.codes['FUNCTION_TYPE'].find(item => item.code === functionType);
    }

    function getFunctionIconPath(functionType) {
        const info = getFunctionTypeInfo(functionType);
        return info ? info.icon : '';
    }

    /* ================= Node add / delete / move ================= */

    function addStepItem(parentNodeId, branchId) {
        openFunctionTypeModal(null, function(selectedCode) {
            const nodeId = createNodeId();

            nodeMap.set(nodeId, createNode(nodeId, selectedCode));

            targetChain(parentNodeId, branchId).push(nodeId);

            renderWorkflow();
            openNodeDrawer(nodeId);

            if (selectedCode === CONDITION_TYPE) {
                $("#drawerConditionList textarea").first().trigger('focus');
            }
            else {
                $("#drawerFunctionName").trigger('focus');
            }
        });
    }

    function targetChain(parentNodeId, branchId) {
        if (!parentNodeId) {
            return rootChain;
        }

        return branchOf(getNode(parentNodeId), branchId);
    }

    function deleteNode(nodeId) {
        const node = getNode(nodeId);
        if (!node) return;

        const childCount = countBranchNodes(node);
        if (childCount > 0 && !confirm(`가지 안의 노드 ${childCount}개도 함께 삭제됩니다. 삭제하시겠습니까?`)) {
            return;
        }

        removeFromChains(rootChain, nodeId);
        removeNodeData(node);

        renderWorkflow();
    }

    function countBranchNodes(node) {
        if (!isConditionNode(node)) return 0;

        let count = 0;
        eachBranchChain(node, function(chain) {
            count += countChainNodes(chain);
        });

        return count;
    }

    function countChainNodes(chain) {
        let count = 0;

        for (const nodeId of chain) {
            count++;

            const node = getNode(nodeId);
            if (isConditionNode(node)) {
                count += countBranchNodes(node);
            }
        }

        return count;
    }

    function removeFromChains(chain, nodeId) {
        const index = chain.indexOf(nodeId);
        if (index >= 0) {
            chain.splice(index, 1);
            return true;
        }

        for (const id of chain) {
            const node = getNode(id);
            if (!isConditionNode(node)) continue;

            for (const branchId of branchIds(node)) {
                if (removeFromChains(branchOf(node, branchId), nodeId)) {
                    return true;
                }
            }
        }

        return false;
    }

    function removeNodeData(node) {
        if (isConditionNode(node)) {
            eachBranchChain(node, removeChainData);
        }

        nodeMap.delete(node.nodeId);

        if (activeNodeId === node.nodeId) {
            closeNodeDrawer();
        }
    }

    function removeChainData(chain) {
        for (const nodeId of chain) {
            const node = getNode(nodeId);
            if (node) removeNodeData(node);
        }
    }

    function setChainSortable() {
        $("#workflowGrid .wf-chain").sortable({
            handle: ".step-drag-handle",
            cancel: ".step-tool",
            cursor: "move",
            placeholder: "workflow-item-placeholder",
            tolerance: "pointer",
            items: "> .wf-node-wrap",
            connectWith: "#workflowGrid .wf-chain",
            start: function(event, ui) {
                dragSnapshot = createModelSnapshot();

                // 자기 자신의 하위 가지로는 옮길 수 없다(자기 안에 자기를 넣는 꼴).
                ui.item.find('.wf-chain').sortable('option', 'disabled', true);
            },
            sort: function() {
                // 드래그 도중에도 다시 그리지 않으면 카드는 실시간으로 움직이는데
                // 화살표는 드롭 전 좌표에 멈춰있어 서로 어긋나 보인다(찌그러진 것처럼 보임).
                drawConnectors();
            },
            stop: function(event, ui) {
                ui.item.find('.wf-chain').sortable('option', 'disabled', false);

                syncModelFromDom();

                if (!validateChains()) {
                    alert("조건분기 노드 뒤에는 노드를 놓을 수 없습니다. 조건 가지 안으로 옮겨주세요.");
                    restoreModelSnapshot(dragSnapshot);
                }

                dragSnapshot = null;

                // 드래그 뒷정리가 끝난 다음 틱에 다시 그린다.
                // stop 안에서 곧바로 DOM을 비우면 jQuery UI 가 정리 중인 엘리먼트를 잃어버린다.
                setTimeout(renderWorkflow, 0);
            }
        });
    }

    /* ================= Connectors ================= */

    function drawConnectors() {
        const svg = document.getElementById('connectorLayer');
        const grid = document.getElementById('workflowGrid');
        if (!svg || !grid) return;

        // svg의 height:100%는 flex 컨테이너(auto height)를 기준으로 정확히 계산되지 않아
        // 화살표가 중간에 잘리는 문제가 있어 실제 그리드 크기로 명시적으로 지정한다.
        // 주의: grid.scrollWidth/scrollHeight는 쓰면 안 된다 - svg 자신이 grid의 자식이라
        // 이전에 지정해둔 svg 크기가 grid의 스크롤 크기에 그대로 반영되어, 한 번 커지면
        // 다시 줄어들지 않는 자기증식 버그가 생긴다(사이드바 접었다 펴면 화살표가 어긋남).
        // absolute 포지션인 svg는 auto-height 계산에서 제외되므로 getBoundingClientRect가 안전하다.
        const gridRect = grid.getBoundingClientRect();
        svg.setAttribute('width', gridRect.width);
        svg.setAttribute('height', gridRect.height);

        const defs = svg.querySelector('defs');
        svg.innerHTML = '';
        if (defs) svg.appendChild(defs);

        const container = svg.getBoundingClientRect();

        // 1) 체인 안에서 위아래로 이어지는 직선 흐름
        grid.querySelectorAll('.wf-chain').forEach(function(chain) {
            const items = Array.from(chain.children).filter(el =>
                el.classList.contains('wf-node-wrap') || el.classList.contains('add-step-item'));

            for (let i = 0; i < items.length - 1; i++) {
                const from = anchorOf(items[i]);
                const to = anchorOf(items[i + 1]);

                drawLine(svg, container, from.x, from.bottom, to.x, to.top);
            }
        });

        // 2) 조건분기 노드에서 각 가지로 갈라지는 흐름
        grid.querySelectorAll('.wf-node-wrap').forEach(function(wrap) {
            const row = wrap.querySelector(':scope > .wf-branch-row');
            if (!row) return;

            const from = anchorOf(wrap);

            row.querySelectorAll(':scope > .wf-branch').forEach(function(branch) {
                const head = branch.querySelector(':scope > .wf-branch-head');
                const headRect = head.getBoundingClientRect();
                const headX = headRect.left + headRect.width / 2;

                drawElbow(svg, container, from.x, from.bottom, headX, headRect.top);

                const chain = branch.querySelector(':scope > .wf-chain');
                const first = chain.children[0];
                if (!first) return;

                const to = anchorOf(first);
                drawLine(svg, container, headX, headRect.bottom, to.x, to.top);
            });
        });
    }

    // 연결선의 기준점. 카드는 왼쪽에 드래그 핸들(26px)이 붙어있어 카드 전체 폭의 중앙이
    // 실제 보이는 내용(아이콘/텍스트)의 중앙보다 왼쪽으로 치우친다. 그래서 x는 step-body 기준으로 잡는다.
    // 또 조건분기 래퍼는 하위 가지까지 품고 있으므로 위/아래 좌표는 래퍼가 아니라 카드 기준이어야 한다.
    function anchorOf(el) {
        const card = el.classList.contains('wf-node-wrap')
            ? el.querySelector(':scope > .step-item')
            : el;

        const body = card.querySelector(':scope > .step-body') || card;

        const cardRect = card.getBoundingClientRect();
        const bodyRect = body.getBoundingClientRect();

        return {
            x: bodyRect.left + bodyRect.width / 2,
            top: cardRect.top,
            bottom: cardRect.bottom
        };
    }

    function drawLine(svg, container, x1, y1, x2, y2) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1 - container.left);
        line.setAttribute("y1", y1 - container.top);
        line.setAttribute("x2", x2 - container.left);
        line.setAttribute("y2", y2 - container.top);
        line.setAttribute("stroke", "#c7cbd1");
        line.setAttribute("stroke-width", "2");
        line.setAttribute("marker-end", "url(#connectorArrow)");

        svg.appendChild(line);
    }

    // 조건분기에서 좌우로 갈라지는 연결선. 내려갔다가 옆으로 꺾고 다시 내려온다.
    function drawElbow(svg, container, x1, y1, x2, y2) {
        const sx = x1 - container.left;
        const sy = y1 - container.top;
        const ex = x2 - container.left;
        const ey = y2 - container.top;
        const my = sy + (ey - sy) / 2;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${sx} ${sy} L ${sx} ${my} L ${ex} ${my} L ${ex} ${ey}`);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#c7cbd1");
        path.setAttribute("stroke-width", "2");
        path.setAttribute("stroke-linejoin", "round");
        path.setAttribute("marker-end", "url(#connectorArrow)");

        svg.appendChild(path);
    }

    /* ================= Node detail drawer ================= */

    function openNodeDrawer(nodeId) {
        activeNodeId = nodeId;

        $(".step-item").removeClass("selected");
        $(`#${STEP_ITEM_ID_PREFIX}${nodeId}`).addClass("selected");

        refreshDrawerFields(getNode(nodeId) || {});

        $("#nodeDrawer").addClass("open");
        $("#drawerBackdrop").addClass("show");
    }

    function closeNodeDrawer() {
        activeNodeId = null;
        $(".step-item").removeClass("selected");
        $("#nodeDrawer").removeClass("open");
        $("#drawerBackdrop").removeClass("show");
    }

    function refreshDrawerFields(node) {
        const info = getFunctionTypeInfo(node.functionType) || {};
        const isCondition = node.functionType === CONDITION_TYPE;

        $("#drawerTitle").text(isCondition ? '조건분기 설정' : '노드 설정');
        $("#drawerTypeChip img").attr('src', info.icon || '');
        $("#drawerTypeChip span[name='chip-name']").text(info.name || '유형 선택');
        $("#drawerFunctionName").val(node.functionName || '');
        $("#drawerRequestMessageId").val(node.requestMessageId || '');
        $("#drawerResponseMessageId").val(node.responseMessageId || '');

        // 조건분기는 실행할 기능도, 내보낼 메시지도 없다.
        $("#drawerFunctionNameField").toggle(!isCondition);
        $("#drawerResponseMessageField").toggle(!isCondition);
        $("#drawerFunctionSettingButton").toggle(!isCondition);
        $("#drawerConditionField").toggle(isCondition);

        if (isCondition) {
            renderDrawerConditions(node);
        }
    }

    function renderDrawerConditions(node) {
        const $list = $("#drawerConditionList");
        $list.empty();

        node.conditions.forEach(function(condition, index) {
            const $row = $(`
                <div class="wf-condition-row">
                    <div class="wf-condition-row-head">
                        <span class="wf-branch-label is-case">${branchLabel(condition.branchId, index)}</span>
                        <i class="fas fa-times wf-condition-remove" title="조건 삭제"></i>
                    </div>
                    <textarea class="form-control form-control-sm wf-condition-textarea" rows="2" placeholder="예) params[0].status === 'OK'"></textarea>
                </div>
            `);

            $row.find('textarea')
                .val(condition.conditionExpression || '')
                .on('input', function() {
                    condition.conditionExpression = this.value;
                    updateStepItemView(node.nodeId);
                    updateBranchExpressionView(node.nodeId, condition.branchId, this.value);
                });

            $row.find('.wf-condition-remove').on('click', function() {
                removeCondition(node.nodeId, condition.branchId);
            });

            $list.append($row);
        });

        $list.append(`
            <div class="wf-condition-else">
                <span class="wf-branch-label is-else">else</span>
                <span class="wf-condition-else-help">위 조건에 모두 걸리지 않으면 else 가지로 흐릅니다.</span>
            </div>
        `);
    }

    function addCondition() {
        if (!activeNodeId) return;

        const node = getNode(activeNodeId);
        if (!isConditionNode(node)) return;

        const branchId = createBranchId(node);

        node.conditions.push({branchId:branchId, conditionExpression:''});
        node.branches[branchId] = [];

        const nodeId = node.nodeId;

        renderWorkflow();
        openNodeDrawer(nodeId);

        $("#drawerConditionList textarea").last().trigger('focus');
    }

    function removeCondition(nodeId, branchId) {
        const node = getNode(nodeId);
        if (!node) return;

        if (node.conditions.length <= 1) {
            alert("조건은 최소 한 개가 있어야 합니다. 조건분기를 없애려면 노드를 삭제해주세요.");
            return;
        }

        const count = countChainNodes(branchOf(node, branchId));
        if (count > 0 && !confirm(`이 조건의 가지에 있는 노드 ${count}개도 함께 삭제됩니다. 삭제하시겠습니까?`)) {
            return;
        }

        removeChainData(branchOf(node, branchId));

        delete node.branches[branchId];
        node.conditions = node.conditions.filter(condition => condition.branchId !== branchId);

        renderWorkflow();
        openNodeDrawer(nodeId);
    }

    function onDrawerFieldChange(field, value) {
        if (!activeNodeId) return;

        const node = getNode(activeNodeId);
        if (!node) return;

        node[field] = value;
        updateStepItemView(activeNodeId);
    }

    function changeActiveNodeFunctionType() {
        if (!activeNodeId) return;

        const node = getNode(activeNodeId);
        if (!node) return;

        openFunctionTypeModal(node.functionType, function(selectedCode) {
            if (selectedCode === node.functionType) return;

            if (isConditionNode(node) && countBranchNodes(node) > 0) {
                alert("가지에 노드가 남아있어 유형을 바꿀 수 없습니다. 가지를 먼저 비워주세요.");
                return;
            }

            if (selectedCode === CONDITION_TYPE && !isLastOfChain(node.nodeId)) {
                alert("조건분기는 흐름의 마지막 노드만 지정할 수 있습니다. 뒤에 있는 노드를 옮기거나 지운 뒤 변경해주세요.");
                return;
            }

            const nodeId = node.nodeId;

            node.functionType = selectedCode;
            node.conditions = [];
            node.branches = {};

            if (selectedCode === CONDITION_TYPE) {
                node.displayName = '조건분기';
                resetConditions(node);
            }

            renderWorkflow();
            openNodeDrawer(nodeId);
        });
    }

    function isLastOfChain(nodeId) {
        let last = false;

        function check(chain) {
            const index = chain.indexOf(nodeId);
            if (index >= 0) {
                last = index === chain.length - 1;
                return true;
            }

            for (const id of chain) {
                const node = getNode(id);
                if (!isConditionNode(node)) continue;

                for (const branchId of branchIds(node)) {
                    if (check(branchOf(node, branchId))) {
                        return true;
                    }
                }
            }

            return false;
        }

        check(rootChain);

        return last;
    }

    function openDrawerFunctionSetting() {
        if (!activeNodeId) return;

        const node = getNode(activeNodeId);
        openPopupFunctionSetting(node.functionType, node.functionName);
    }

    function deleteFunctionFromDrawer() {
        if (!activeNodeId) return;
        deleteNode(activeNodeId);
    }

    /* ================= Function type picker (layer popup) ================= */

    function openFunctionTypeModal(currentCode, onSelect) {
        const $list = $('#functionTypeList');
        $list.empty();

        for (const item of App.codes['FUNCTION_TYPE']) {
            const $item = $(`
                <div class="function-type-item ${item.code === currentCode ? 'current' : ''}">
                    <span class="function-type-icon"><img src="${item.icon}" width="40" height="40"></span>
                    <span class="function-type-info">
                        <span class="function-type-name">${item.name}<span class="function-type-code">${item.code}</span></span>
                        <span class="function-type-desc">${item.description}</span>
                    </span>
                </div>
            `);

            $item.on('click', function() {
                $('#functionTypeModal').modal('hide');
                onSelect(item.code);
            });

            $list.append($item);
        }

        $('#functionTypeModal').modal('show');
    }

    function openPopupFunctionSetting(type, functionName) {
        if(!functionName) {
            alert("기능코드를 입력해주세요.");
            return;
        }

        if(type === 'SQL') {
            App.modalPopup.open('/console/workflow-sql',{title:'SQL 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
        else if(type === 'ENTITY') {
            App.modalPopup.open('/console/workflow-entity',{title:'Entity 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
        else if(type === 'REST_CLIENT') {
            App.modalPopup.open('/console/workflow-restclient',{title:'Rest Client 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
        else if(type === 'MESSAGE_PROCESSOR') {
            App.modalPopup.open('/console/workflow-message',{title:'메시지 처리 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
        else if(type === 'NOTIFICATION') {
            App.modalPopup.open('/console/workflow-notification',{title:'알림 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
    }
</script>
<div th:fragment="view">
    <div class="wf-app">
        <aside class="wf-sidebar" id="wfSidebar">
            <div class="wf-sidebar-header">
                <button type="button" class="btn-new-workflow" onclick="newContent()">
                    <i class="fas fa-plus"></i> New Workflow
                </button>
                <div class="wf-search">
                    <input type="text" id="workflowSearch" placeholder="워크플로우 검색" autocomplete="off" oninput="renderWorkflowList()">
                    <i class="fas fa-sync-alt" title="새로고침" onclick="getWorkflowList()"></i>
                </div>
            </div>
            <div class="wf-list" id="workflowList"></div>
        </aside>

        <div class="wf-main">
            <div class="wf-topbar">
                <button type="button" class="wf-sidebar-toggle" onclick="toggleSidebar()" title="목록 접기/펼치기">
                    <i class="fas fa-bars"></i>
                </button>
                <input type="hidden" id="workflowId">
                <div class="wf-title-group">
                    <input type="text" id="workflowCode" class="wf-code-input" placeholder="workflow_code" autocomplete="off">
                    <input type="text" id="displayName" class="wf-name-input" placeholder="워크플로우 이름을 입력하세요" autocomplete="off">
                </div>
                <div class="wf-topbar-actions">
                    <button type="button" onclick="openSettingsModal()"><i class="fas fa-cog"></i> 설정</button>
                    <button type="button" onclick="openExecuteModal()"><i class="fas fa-play"></i> 실행</button>
                    <button type="button" onclick="restore()"><i class="fas fa-undo"></i> 복원</button>
                    <button type="button" class="btn-primary" onclick="save()"><i class="fas fa-save"></i> 저장</button>
                    <button type="button" class="btn-danger" onclick="deleteWorkflow()"><i class="fas fa-trash"></i> 삭제</button>
                </div>
            </div>

            <div class="wf-canvas-wrap">
                <div class="wf-canvas">
                    <div id="workflowGrid"></div>
                </div>

                <div class="wf-drawer-backdrop" id="drawerBackdrop" onclick="closeNodeDrawer()"></div>

                <aside class="wf-node-drawer" id="nodeDrawer">
                    <div class="wf-drawer-header">
                        <span id="drawerTitle" style="font-weight:600;font-size:14px;">노드 설정</span>
                        <button type="button" class="wf-drawer-close" onclick="closeNodeDrawer()">&times;</button>
                    </div>
                    <div class="wf-drawer-body">
                        <div class="wf-field">
                            <label>기능 유형</label>
                            <button type="button" class="function-type-chip" id="drawerTypeChip">
                                <img name="chip-icon" src="" width="18" height="18">
                                <span name="chip-name">유형 선택</span>
                                <i class="fas fa-chevron-down"></i>
                            </button>
                        </div>
                        <div class="wf-field" id="drawerFunctionNameField">
                            <label>기능코드</label>
                            <input type="text" id="drawerFunctionName" class="form-control form-control-sm" placeholder="기능코드 입력" autocomplete="off" oninput="onDrawerFieldChange('functionName', this.value)">
                        </div>
                        <div class="wf-field-row">
                            <div class="wf-field">
                                <label>요청메시지ID (IN)</label>
                                <input type="text" id="drawerRequestMessageId" class="form-control form-control-sm" placeholder="요청메시지ID" autocomplete="off" oninput="onDrawerFieldChange('requestMessageId', this.value)">
                            </div>
                            <div class="wf-field" id="drawerResponseMessageField">
                                <label>응답메시지ID (OUT)</label>
                                <input type="text" id="drawerResponseMessageId" class="form-control form-control-sm" placeholder="응답메시지ID" autocomplete="off" oninput="onDrawerFieldChange('responseMessageId', this.value)">
                            </div>
                        </div>
                        <div class="wf-field" id="drawerConditionField" style="display:none;">
                            <label>조건</label>
                            <div id="drawerConditionList"></div>
                            <button type="button" class="btn btn-default btn-block btn-sm" onclick="addCondition()">
                                <i class="fas fa-plus"></i> else if 추가
                            </button>
                            <div class="wf-field-help">
                                위에서부터 차례로 판정해서 처음 참이 된 조건의 가지로 흐릅니다.
                                params 는 요청메시지ID(IN) 슬롯의 배열입니다.
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-block btn-sm" id="drawerFunctionSettingButton" onclick="openDrawerFunctionSetting()">
                            <i class="fas fa-sliders-h"></i> 상세 설정 열기
                        </button>
                    </div>
                    <div class="wf-drawer-footer">
                        <button type="button" class="btn btn-outline-danger btn-block btn-sm" onclick="deleteFunctionFromDrawer()">
                            <i class="fas fa-trash"></i> 노드 삭제
                        </button>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <!-- Function type picker (layer popup) -->
    <div class="modal fade" id="functionTypeModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">기능 유형 선택</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="functionTypeList" class="function-type-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Workflow settings (auth / authority) -->
    <div class="modal fade" id="settingsModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">워크플로우 설정</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="wf-field" style="margin-bottom:18px;">
                        <label for="useAuthValidation">인증 사용</label>
                        <div class="custom-control custom-switch" style="transform: scale(1.3); transform-origin: left center;">
                            <input type="checkbox" class="custom-control-input" id="useAuthValidation">
                            <label for="useAuthValidation" class="custom-control-label" style="cursor:pointer;"></label>
                        </div>
                    </div>
                    <div class="wf-field">
                        <label>권한</label>
                        <div id="authorityChips" class="wf-authority-chips"></div>
                        <div class="wf-authority-add">
                            <select id="authoritySelect" class="form-control form-control-sm"></select>
                            <button type="button" class="btn btn-default btn-sm" onclick="addAuthorityChip()">추가</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Execute -->
    <div class="modal fade" id="executeModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">워크플로우 실행</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="wf-field">
                        <label style="display:flex;align-items:center;justify-content:space-between;">
                            요청 메시지
                            <button type="button" class="btn btn-default btn-sm" onclick="addExecuteRow()">
                                <i class="fas fa-plus"></i> 행 추가
                            </button>
                        </label>
                        <div id="executeRows"></div>
                    </div>
                    <div class="wf-field">
                        <label style="display:flex;align-items:center;justify-content:space-between;">
                            실행 결과
                            <button type="button" class="btn btn-default btn-sm" onclick="copyExecuteResult()">
                                <i class="fas fa-copy"></i> 복사
                            </button>
                        </label>
                        <textarea class="form-control wf-console-textarea" id="responseData" rows="10" readonly></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" onclick="execute()">
                        <i class="fas fa-play"></i> 실행
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
