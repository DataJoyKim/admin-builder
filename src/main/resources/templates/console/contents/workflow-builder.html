<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    /* ============ Full-height page shell ============ */
    /* adminlte.js의 fixLayoutHeight()가 로드 시 html/body에 인라인 height:auto를
       강제로 지정해버려서 일반 규칙으로는 무시된다. !important로 덮어써야 한다. */
    html, body {
        height: 100% !important;
        margin: 0;
    }

    .wrapper {
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .wrapper > div {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    /* ============ App shell ============ */
    .wf-app {
        display: flex;
        flex: 1;
        min-height: 0;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        background: #ffffff;
    }

    /* ============ Sidebar (workflow list) ============ */
    .wf-sidebar {
        width: 280px;
        flex: 0 0 280px;
        border-right: 1px solid #eef0f2;
        display: flex;
        flex-direction: column;
        background: #fbfbfc;
        margin-left: 0;
        transition: margin-left .18s ease;
        overflow: hidden;
    }

    .wf-sidebar.collapsed {
        margin-left: -280px;
    }

    .wf-sidebar-header {
        padding: 14px;
        border-bottom: 1px solid #eef0f2;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .btn-new-workflow {
        width: 100%;
        border: none;
        border-radius: 8px;
        background: #4A90E2;
        color: #fff;
        padding: 9px 12px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
    }

    .btn-new-workflow:hover {
        background: #3d7fce;
    }

    .wf-search {
        position: relative;
    }

    .wf-search input {
        width: 100%;
        padding: 6px 30px 6px 10px;
        border: 1px solid #d7dbe0;
        border-radius: 6px;
        font-size: 12.5px;
    }

    .wf-search i {
        position: absolute;
        right: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        cursor: pointer;
        font-size: 12px;
    }

    .wf-search i:hover {
        color: #4A90E2;
    }

    .wf-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
    }

    .wf-list-empty {
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
        padding: 24px 0;
    }

    .wf-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 4px;
    }

    .wf-list-item:hover {
        background: #f1f3f5;
    }

    .wf-list-item.active {
        background: #eef5ff;
    }

    .wf-list-item-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #eef1f4;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6b7280;
        flex: 0 0 30px;
        font-size: 12px;
    }

    .wf-list-item.active .wf-list-item-icon {
        background: #4A90E2;
        color: #fff;
    }

    .wf-list-item-info {
        min-width: 0;
    }

    .wf-list-item-name {
        font-size: 13.5px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .wf-list-item-code {
        font-size: 11.5px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ============ Main area ============ */
    .wf-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .wf-topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid #eef0f2;
    }

    .wf-sidebar-toggle {
        border: none;
        background: transparent;
        color: #6b7280;
        font-size: 16px;
        cursor: pointer;
        padding: 4px 6px;
    }

    .wf-title-group {
        display: flex;
        gap: 6px;
        flex: 1;
        min-width: 0;
    }

    .wf-code-input, .wf-name-input {
        border: 1px solid transparent;
        background: transparent;
        border-radius: 6px;
        padding: 4px 8px;
    }

    .wf-code-input:hover, .wf-name-input:hover {
        border-color: #e5e7eb;
    }

    .wf-code-input:focus, .wf-name-input:focus {
        background: #f1f3f5;
        outline: none;
        border-color: #e5e7eb;
    }

    .wf-code-input {
        font-size: 12px;
        color: #9199a3;
        width: 160px;
    }

    .wf-name-input {
        font-size: 16px;
        font-weight: 600;
        color: #1f2937;
        flex: 1;
        min-width: 0;
    }

    .wf-topbar-actions {
        display: flex;
        gap: 6px;
        flex: 0 0 auto;
    }

    .wf-topbar-actions button {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
        color: #374151;
        white-space: nowrap;
    }

    .wf-topbar-actions button:hover {
        background: #f1f3f5;
    }

    .wf-topbar-actions button.btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    .wf-topbar-actions button.btn-primary:hover {
        background: #3d7fce;
    }

    .wf-topbar-actions button.btn-danger {
        color: #dc2626;
        border-color: #f3c9c9;
    }

    .wf-topbar-actions button.btn-danger:hover {
        background: #fef2f2;
    }

    /* ============ Canvas ============ */
    .wf-canvas-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
    }

    .wf-canvas {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        overflow: auto;
        background-color: #fafbfc;
        background-image: radial-gradient(circle, #d7dce3 1.2px, transparent 1.2px);
        background-size: 20px 20px;
        padding: 40px 0 60px 0;
    }

    /* #workflowGrid를 카드 폭(300px)에 딱 맞춰 고정하고, 그리드 자체를
       margin:auto로 가운데 정렬한다. 카드(.step-item)는 그리드 폭을 그대로
       채우기만 하면 되므로 카드 쪽에는 auto 마진이 전혀 없다.
       (예전엔 flex(align-items:center) 또는 카드 자체에 margin:auto를 줘서
       중앙 정렬했는데, 드래그 시 jQuery UI Sortable이 카드를 position:absolute로
       바꾸면서 margin:auto로 계산된 오프셋을 반영하지 못해 카드가 그리드
       왼쪽 끝(0)으로 튀어버리는 문제가 있었다 - "레이아웃 좌측에 노드 그림자가
       생기는" 현상이 바로 이것이었다. 드래그 대상이 아닌 그리드 자체를
       중앙 정렬하면 이 문제를 원천적으로 피할 수 있다.) */
    #workflowGrid {
        position: relative;
        width: 300px;
        margin: 0 auto;
        min-height: 100%;
    }

    #connectorLayer {
        overflow: visible;
    }

    .step-item {
        position: relative;
        background-color: #ffffff;
        width: 300px;
        border-radius: 12px;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        font-size: 14px;
        border: 1px solid #e2e5ea;
        box-shadow: 0 1px 3px rgba(16, 24, 40, .07);
        margin: 0 0 40px 0;
        word-break: break-word;
        overflow-wrap: break-word;
        cursor: pointer;
        /* z-index를 여기 주지 않는다: 주면 카드가 로컬 stacking context를 가져서
           선택 시 뜨는 삭제버튼(.step-tools)이 상세창 딤(backdrop, z-index:4)보다
           위로 못 올라가 클릭이 씹힌다. 화살표보다 위에 그려지는 건 DOM 순서로 해결한다. */
        transition: box-shadow .15s ease, border-color .15s ease;
    }

    .step-item:hover {
        box-shadow: 0 6px 16px rgba(16, 24, 40, .12);
    }

    .step-item.selected {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .18);
    }

    /* ============ Drag handle (node move) ============ */
    .step-drag-handle {
        flex: 0 0 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafbfc;
        border-right: 1px solid #eef0f2;
        border-top-left-radius: 11px;
        border-bottom-left-radius: 11px;
        color: #c7cbd1;
        cursor: grab;
    }

    .step-drag-handle:hover {
        background: #eef5ff;
        color: #4A90E2;
    }

    .step-drag-handle:active {
        cursor: grabbing;
    }

    .step-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    .add-step-item {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        border: 2px dashed #c7cbd1;
        color: #9199a3;
        cursor: pointer;
        margin: 0 auto;
        /* step-item은 왼쪽에 26px 드래그 핸들이 있어 카드 내용 중심이 그만큼 오른쪽으로
           치우쳐 있다. + 버튼도 같은 만큼(핸들 폭의 절반) 오른쪽으로 밀어야
           화살표가 일직선으로 이어진다. */
        left: 13px;
        transition: all .15s ease;
    }

    .add-step-item:hover {
        border-color: #4A90E2;
        color: #4A90E2;
        background-color: #eef5ff;
    }

    .step-message {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 6px 16px;
    }

    .step-message-type {
        font-size: 10px;
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 12px;
    }

    .message-in {
        background-color: #bae6ff;
        color: #0369a1;
    }

    .message-out {
        background-color: #a8f0a0;
        color: #047857;
    }

    .step-message-id {
        font-weight: 500;
        font-size: 12px;
    }

    .step-function {
        flex: 1;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        padding: 14px 16px;
        gap: 12px;
        border-top: 1px solid #eef0f2;
        border-bottom: 1px solid #eef0f2;
        cursor: pointer;
    }

    .step-function-img {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .step-function-img img {
        border-radius: 8px;
    }

    .step-function-name {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .function-display-name {
        color: #1f2937;
        font-weight: 600;
        font-size: 15px;
    }

    .function-name {
        color: #8a94a6;
        font-weight: 400;
        font-size: 12px;
    }

    .step-tools {
        position: absolute;
        top: -34px;
        right: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        background-color: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 5px 9px;
        box-shadow: 0 2px 6px rgba(16, 24, 40, .12);
        opacity: 0;
        /* pointer-events는 항상 auto로 둬야 한다. 이 버튼은 카드 바깥(top:-34px)에
           떠 있어서 카드 박스와 버튼 박스 사이에 빈 틈이 있는데, hover일 때만
           auto로 바꾸면 마우스가 카드를 벗어나 버튼 쪽으로 이동하는 순간
           :hover가 풀리면서 pointer-events가 다시 none이 되어 버튼이 클릭은커녕
           자기 자신에 대한 hover조차 받을 수 없는(hit-test에서 제외되는) 상태에
           빠져 버려 클릭이 전혀 먹히지 않았다.
        */
        pointer-events: auto;
        transition: opacity .12s ease;
        /* 상세창 딤(.wf-drawer-backdrop, z-index:3)보다는 위에 있어야 선택된 노드의
           삭제 버튼이 딤에 가려 클릭이 씹히지 않는다. 다만 상세창 패널 자체
           (.wf-node-drawer, z-index:5)보다는 아래여야 한다 - 캔버스가 좁아서 카드가
           상세창 패널 밑까지 걸치는 경우 버튼이 상세창 내용을 덮어버리는 것을 막기 위함.
        */
        z-index: 4;
    }

    .step-item:hover .step-tools,
    .step-item.selected .step-tools,
    .step-tools:hover {
        opacity: 1;
    }

    .step-tool {
        cursor: pointer;
        color: #9199a3;
        font-size: 11px;
    }

    .step-tool:hover {
        color: #dc2626;
    }

    /* ============ Function type chip ============ */
    .function-type-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: 1px solid #d7dbe0;
        border-radius: 8px;
        background: #fff;
        padding: 7px 10px;
        font-size: 13px;
        color: #1f2937;
        cursor: pointer;
    }

    .function-type-chip:hover {
        border-color: #4A90E2;
    }

    .function-type-chip img {
        border-radius: 4px;
    }

    .function-type-chip span[name="chip-name"] {
        flex: 1;
        text-align: left;
    }

    .function-type-chip i {
        font-size: 10px;
        color: #9199a3;
    }

    /* ============ Function type picker modal ============ */
    .function-type-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 60vh;
        overflow-y: auto;
    }

    .function-type-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        cursor: pointer;
        transition: all .12s ease;
    }

    .function-type-item:hover {
        border-color: #4A90E2;
        background-color: #f5f9ff;
    }

    .function-type-item.current {
        border-color: #4A90E2;
        background-color: #eef5ff;
    }

    .function-type-icon {
        flex: 0 0 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .function-type-icon img {
        border-radius: 6px;
    }

    .function-type-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
    }

    .function-type-name {
        font-size: 15px;
        font-weight: 600;
        color: #1f2937;
    }

    .function-type-code {
        font-size: 11px;
        font-weight: 400;
        color: #9199a3;
        margin-left: 6px;
    }

    .function-type-desc {
        font-size: 12.5px;
        color: #6b7280;
    }

    /* ============ Node detail drawer ============ */
    .wf-drawer-backdrop {
        position: absolute;
        top: 0; left: 0; right: 380px; bottom: 0;
        background: rgba(17, 24, 39, .06);
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s ease;
        z-index: 3;
    }

    .wf-drawer-backdrop.show {
        opacity: 1;
        pointer-events: auto;
    }

    .wf-node-drawer {
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 380px;
        background: #fff;
        border-left: 1px solid #e5e7eb;
        box-shadow: -6px 0 18px rgba(16, 24, 40, .08);
        transform: translateX(100%);
        transition: transform .18s ease;
        display: flex;
        flex-direction: column;
        z-index: 5;
    }

    .wf-node-drawer.open {
        transform: translateX(0);
    }

    .wf-drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid #eef0f2;
    }

    .wf-drawer-close {
        border: none;
        background: transparent;
        font-size: 20px;
        color: #9199a3;
        cursor: pointer;
        line-height: 1;
    }

    .wf-drawer-body {
        padding: 16px;
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .wf-drawer-footer {
        padding: 14px 16px;
        border-top: 1px solid #eef0f2;
    }

    .wf-field label {
        font-size: 12px;
        font-weight: 600;
        color: #6b7280;
        display: block;
        margin-bottom: 6px;
    }

    .wf-field-row {
        display: flex;
        gap: 10px;
    }

    .wf-field-row .wf-field {
        flex: 1;
    }

    /* ============ Settings modal ============ */
    .wf-authority-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
        min-height: 26px;
    }

    .wf-authority-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #eef5ff;
        color: #1d4ed8;
        border-radius: 14px;
        padding: 4px 10px;
        font-size: 12px;
    }

    .wf-authority-chip i {
        cursor: pointer;
        font-size: 10px;
    }

    .wf-chip-empty {
        color: #9199a3;
        font-size: 12px;
    }

    .wf-authority-add {
        display: flex;
        gap: 8px;
    }

    .wf-authority-add select {
        flex: 1;
    }

    /* ============ Execute modal ============ */
    .wf-execute-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 24px;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
    }

    .wf-execute-row-remove {
        cursor: pointer;
        color: #9199a3;
        text-align: center;
    }

    .wf-execute-row-remove:hover {
        color: #dc2626;
    }

    /* bootstrap의 .form-control[readonly] 배경색 규칙이 명시도가 더 높아
       !important 없이는 다크 콘솔 배경이 먹히지 않는다. */
    .wf-console-textarea,
    .wf-console-textarea[readonly] {
        background-color: #1e1e1e !important;
        color: #6fe36f;
        font-family: "Consolas", "Menlo", "Monaco", monospace;
        font-size: 12.5px;
        line-height: 1.5;
        border: 1px solid #333;
        border-radius: 6px;
        resize: vertical;
        caret-color: transparent;
        opacity: 1;
    }

    .wf-console-textarea:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(74, 144, 226, .35);
    }
</style>
<script th:fragment="script">
    App.codes = {
        "FUNCTION_TYPE": [
            {code: "SQL", name: "SQL", icon: "/dist/img/func-sql.png", description: "직접 작성한 SQL 쿼리를 실행합니다."},
            {code: "ENTITY", name: "Entity", icon: "/dist/img/func-entity.png", description: "등록된 엔티티 정의를 기준으로 데이터를 조회·등록·수정·삭제합니다."},
            {code: "REST_CLIENT", name: "Rest Client", icon: "/dist/img/func-restclient.png", description: "등록된 외부 REST 서버를 호출하여 연동합니다."},
            {code: "MESSAGE_PROCESSOR", name: "메시지처리", icon: "/dist/img/func-message.png", description: "스크립트로 요청/응답 메시지를 가공하고 변환합니다."},
            {code: "NOTIFICATION", name: "알림", icon: "/dist/img/func-notification.png", description: "이메일 등 채널로 알림을 발송합니다."}
        ]
    };

    const STEP_ITEM_ID_PREFIX = 'step-item-';

    let workflowListData = [];
    let selectedWorkflowId = null;
    let activeNodeId = null;
    let authorityCodesMaster = [];
    let currentAuthorityList = [];
    let executeRows = [];
    let executeRowSeq = 0;

    $( document ).ready(function() {
        init();

        let connectorResizeTimer = null;
        $(window).on('resize', function() {
            clearTimeout(connectorResizeTimer);
            connectorResizeTimer = setTimeout(drawConnectors, 100);
        });

        $(document).on("click", "#drawerTypeChip", function() {
            if (!activeNodeId) return;

            const data = getStepItemData(activeNodeId);
            openFunctionTypeModal(data.functionType, function(selectedCode) {
                data.functionType = selectedCode;
                setStepItemData(activeNodeId, data);
                refreshDrawerFields(data);
            });
        });
    });

    function init() {
        getWorkflowList();
        setAuthorityCodesMaster();
        setWorkflowGrid();
        newContent();
    }

    /* ================= Workflow list (left sidebar) ================= */

    function getWorkflowList() {
        httpClient.get(`/console/api/workflow`, {},
            function(response){
                workflowListData = response;
                renderWorkflowList();
            },
            function(error){
                alert('조회하는데 실패하였습니다.');
            }
        );
    }

    function renderWorkflowList() {
        const keyword = ($("#workflowSearch").val() || '').toLowerCase();
        const $list = $("#workflowList");
        $list.empty();

        const filtered = workflowListData.filter(w =>
            !keyword ||
            (w.workflowCode || '').toLowerCase().includes(keyword) ||
            (w.displayName || '').toLowerCase().includes(keyword)
        );

        if (filtered.length === 0) {
            $list.append(`<div class="wf-list-empty">워크플로우가 없습니다.</div>`);
            return;
        }

        for (const w of filtered) {
            const $item = $(`
                <div class="wf-list-item ${w.id === selectedWorkflowId ? 'active' : ''}">
                    <span class="wf-list-item-icon"><i class="fas fa-project-diagram"></i></span>
                    <span class="wf-list-item-info">
                        <div class="wf-list-item-name">${w.displayName || '(이름없음)'}</div>
                        <div class="wf-list-item-code">${w.workflowCode || ''}</div>
                    </span>
                </div>
            `);

            $item.on('click', function() {
                selectedContent(w.id);
            });

            $list.append($item);
        }
    }

    function toggleSidebar() {
        $("#wfSidebar").toggleClass('collapsed');
        setTimeout(drawConnectors, 200); // 사이드바 접기/펼치기 트랜지션(.18s) 종료 후 화살표 재계산
    }

    /* ================= Workflow CRUD ================= */

    function save() {
        httpClient.post(`/console/api/workflow/save`,{},
            {
                workflow:getContent(),
                workflowFunctions:getWorkflowFunctionData(),
                workflowAuthority:currentAuthorityList
            },
            function(response){
                alert("저장 완료되었습니다.");
                getWorkflowList();
                selectedContent(response.id);
            },
            function(error){
                alert("에러 발생하였습니다.");
            }
        );
    }

    function getWorkflowFunctionData() {
        const stepItems = document.querySelectorAll('#workflowGrid .step-item');

        let items = new Array();
        for(const stepItem of stepItems) {
            items.push(getStepItemData(stepItem.id));
        }

        return items;
    }

    function deleteWorkflow() {
        if(!confirm("삭제하시겠습니까?")) {
            return;
        }

        let id = $("#workflowId").val();

        httpClient.delete(`/console/api/workflow/${id}`, {},
          function(response){
              alert("삭제 처리 완료되었습니다.");
              getWorkflowList();
              newContent();
          },
          function(error){
              alert('error');
          }
        );
    }

    function selectedContent(workflowId) {
        httpClient.get(`/console/api/workflow/${workflowId}`, {},
            function(response){
                selectedWorkflowId = response.id;
                setContentData(response);
                getWorkflowFunction(workflowId);
                getWorkflowAuthority(workflowId);
                initExecuteGrid();
                renderWorkflowList();
            },
            function(error){
                alert('error');
            }
        );
    }

    function setContentData(response) {
        setContent({
            id:response.id,
            workflowCode:response.workflowCode,
            displayName:response.displayName,
            useAuthValidation:response.useAuthValidation
          });
    }

    function getContent() {
        return {
            id: $("#workflowId").val(),
            workflowCode: $("#workflowCode").val(),
            displayName: $("#displayName").val(),
            note: '',
            useAuthValidation:App.util.isCheck('useAuthValidation')
        }
    }

    function setContent(params) {
        $("#workflowId").val(params.id);
        $("#workflowCode").val(params.workflowCode);
        $("#displayName").val(params.displayName);
        App.util.check('useAuthValidation', params.useAuthValidation);
    }

    function newContent(){
        selectedWorkflowId = null;

        setContent({
            id:'',
            workflowCode:'',
            displayName:'',
            useAuthValidation:true
            });

        drawWorkflow('workflowGrid',[]);
        currentAuthorityList = [];
        renderAuthorityChips();
        initExecuteGrid();
        renderWorkflowList();
    }

    function restore() {
        const workflowId = $("#workflowId").val();
        if(workflowId) {
            selectedContent(workflowId);
        }
        else {
            newContent();
        }
    }

    /* ================= Settings (auth / authority) ================= */

    function setAuthorityCodesMaster() {
        httpClient.get(`/console/api/authority`, {},
            function(response){
                authorityCodesMaster = response;
                renderAuthorityChips();
            },
            function(error){
                alert('error');
            }
        );
    }

    function getWorkflowAuthority(workflowId) {
        httpClient.get(`/console/api/workflow-authority`, {workflowId:workflowId},
            function(response){
                currentAuthorityList = response.map(r => ({authorityCode:r.authorityCode}));
                renderAuthorityChips();
            },
            function(error){
                alert('error');
            }
        );
    }

    function renderAuthorityChips() {
        const $chips = $("#authorityChips");
        $chips.empty();

        if (currentAuthorityList.length === 0) {
            $chips.append(`<span class="wf-chip-empty">등록된 권한이 없습니다.</span>`);
        }

        for (const item of currentAuthorityList) {
            const master = authorityCodesMaster.find(a => a.code === item.authorityCode);
            const label = master ? master.name : item.authorityCode;

            const $chip = $(`
                <span class="wf-authority-chip">${label} <i class="fas fa-times"></i></span>
            `);

            $chip.find('i').on('click', function() {
                removeAuthorityChip(item.authorityCode);
            });

            $chips.append($chip);
        }

        const $select = $("#authoritySelect");
        $select.empty().append(`<option value="">권한 추가...</option>`);
        for (const a of authorityCodesMaster) {
            if (!currentAuthorityList.some(item => item.authorityCode === a.code)) {
                $select.append(`<option value="${a.code}">${a.name}</option>`);
            }
        }
    }

    function addAuthorityChip() {
        const code = $("#authoritySelect").val();
        if (!code) return;

        currentAuthorityList.push({authorityCode:code});
        renderAuthorityChips();
    }

    function removeAuthorityChip(code) {
        currentAuthorityList = currentAuthorityList.filter(item => item.authorityCode !== code);
        renderAuthorityChips();
    }

    function openSettingsModal() {
        renderAuthorityChips();
        $('#settingsModal').modal('show');
    }

    /* ================= Execute ================= */

    function initExecuteGrid() {
        executeRows = [];
        executeRowSeq = 0;
        $("#responseData").val('');
        renderExecuteRows();
    }

    function renderExecuteRows() {
        const $rows = $("#executeRows");
        $rows.empty();

        for (const row of executeRows) {
            const $row = $(`
                <div class="wf-execute-row">
                    <input type="text" class="form-control form-control-sm" placeholder="메시지ID">
                    <input type="text" class="form-control form-control-sm" placeholder="컬럼">
                    <input type="text" class="form-control form-control-sm" placeholder="값">
                    <i class="fas fa-times wf-execute-row-remove"></i>
                </div>
            `);

            const $inputs = $row.find('input');
            $inputs.eq(0).val(row.messageId).on('input', function(){ row.messageId = this.value; });
            $inputs.eq(1).val(row.key).on('input', function(){ row.key = this.value; });
            $inputs.eq(2).val(row.value).on('input', function(){ row.value = this.value; });

            $row.find('.wf-execute-row-remove').on('click', function() {
                executeRows = executeRows.filter(r => r.seq !== row.seq);
                renderExecuteRows();
            });

            $rows.append($row);
        }
    }

    function addExecuteRow() {
        executeRows.push({seq:++executeRowSeq, messageId:'', key:'', value:''});
        renderExecuteRows();
    }

    function execute() {
        const body = executeRows.reduce((result, item) => {
            if (!item.messageId) return result;

            if (!result[item.messageId]) {
                result[item.messageId] = [];
            }
            result[item.messageId].push({messageId:item.messageId, key:item.key, value:item.value});
            return result;
        }, {});

        let header = {workflowCode : $("#workflowCode").val()};

        httpClient.post(`/workflow`,{},{body:body,header:header},
            function(response){
                $("#responseData").val(JSON.stringify(response,null,3));
            },
            function(error){
                $("#responseData").val(JSON.stringify(error.responseJSON,null,3));
            }
        );
    }

    function openExecuteModal() {
        $('#executeModal').modal('show');
    }

    function copyExecuteResult() {
        const text = $("#responseData").val();
        if (!text) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
        } else {
            const $textarea = $("#responseData");
            $textarea.trigger('select');
            document.execCommand('copy');
        }
    }

    /* ================= Canvas / nodes ================= */

    function setWorkflowGrid() {
        $("#workflowGrid").sortable({
            axis: "y",
            handle: ".step-drag-handle",
            cancel: ".step-tool",
            cursor: "move",
            placeholder: "workflow-item-placeholder",
            tolerance: "pointer",
            items: ".step-item:not(.add-step-item)",
            sort: function() {
                // 드래그 도중에도 다시 그리지 않으면 카드는 실시간으로 움직이는데
                // 화살표는 드롭 전 좌표에 멈춰있어 서로 어긋나 보인다(찌그러진 것처럼 보임).
                drawConnectors();
            },
            update: function() {
                setStepItemsOrderNum();
                drawConnectors();
            }
        });

        $("<style>")
        .prop("type", "text/css")
        .html(`
          .workflow-item-placeholder {
            width: 300px;
            height: 90px;
            border: 2px dashed #4A90E2;
            background: #eef5ff;
            margin: 0 0 40px 0;
            border-radius: 12px;
          }
        `)
        .appendTo("head");
    }

    function setStepItemsOrderNum() {
        $("#workflowGrid .step-item").each(function(index) {
            const data = $(this).data("data");
            if (data) {
                data.orderNum = index + 1;
            }
        });
    }

    function getWorkflowFunction(workflowId) {
        httpClient.get(`/console/api/workflow-function`, {workflowId:workflowId},
            function(response){
                drawWorkflow('workflowGrid',response);
            },
            function(error){
                alert('error');
            }
        );
    }

    function drawWorkflow(id, response){
        const layout = $("#"+id);

        layout.empty();
        closeNodeDrawer();

        // 화살표 svg를 카드보다 먼저 넣어야(DOM 순서상 아래) z-index 없이도
        // 카드가 화살표 위에 그려진다. z-index를 쓰면 노드 카드가 로컬 stacking
        // context를 갖게 되어, 노드 선택 시 뜨는 삭제버튼이 상세창 딤(backdrop)보다
        // 위로 올라올 수 없어 클릭이 씹히는 문제가 있었다.
        layout.append(renderConnectLine());

        for(let data of response) {
            const itemId = STEP_ITEM_ID_PREFIX+data.id;
            layout.append(renderStepItem(itemId, data));
        }
        layout.append(renderAddStepItem());

        drawConnectors();

        for(let data of response) {
            setStepItemData(STEP_ITEM_ID_PREFIX+data.id, data);
        }
    }

    function renderAddStepItem() {
        return $(`
            <div class="add-step-item connector" title="단계 추가" onclick="addStepItem()">
                <i class="fas fa-plus"></i>
            </div>
        `);
    }

    function renderConnectLine() {
        return $(`
            <svg id="connectorLayer" width="100%" height="100%" style="position:absolute; top:0; left:0; pointer-events:none;">
                <defs>
                    <!-- orient="auto"는 화살표 도형이 오른쪽(+x)을 향해 그려져 있다고 가정하고
                         경로 진행 방향 각도만큼 회전시킨다. 세로선(아래 방향, 90도 회전)에
                         맞춰 화살표를 아래쪽을 향하도록 그려두면 회전이 90도 더 들어가
                         옆으로 돌아간 것처럼(끝부분이 찌그러진 것처럼) 보이는 문제가 있었다.
                         그래서 화살표를 오른쪽을 향하도록 그려서 orient="auto"가 올바르게
                         회전시키도록 수정했다. -->
                    <marker id="connectorArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                        <path d="M0,0 L0,8 L7,4 Z" fill="#c7cbd1"></path>
                    </marker>
                </defs>
            </svg>
        `);
    }

    function setStepItemData(id, data) {
        $('#'+id).data('data', data);

        for(let columnName in data) {
            const value = data[columnName];
            if(columnName == 'functionType') {
                $(`#${id} [name="view-${columnName}"]`).attr("src", getFunctionIconPath(value));
            }
            else {
                $(`#${id} [name="view-${columnName}"]`).text((value) ? value : '');
            }
        }

        if (id === activeNodeId) {
            refreshDrawerFields(data);
        }
    }

    function getStepItemData(id) {
        return $('#'+id).data('data');
    }
    function removeStepItemData(id) {
        $('#'+id).removeData("data");
    }

    function getFunctionTypeInfo(functionType) {
        return App.codes['FUNCTION_TYPE'].find(item => item.code === functionType);
    }

    function getFunctionIconPath(functionType) {
        const info = getFunctionTypeInfo(functionType);
        return info ? info.icon : null;
    }

    const STEP_CLICK_DELAY = 220; // 더블클릭과 구분하기 위한 단일클릭 지연시간(ms)

    function renderStepItem(id, data) {
        const stepItemEl = $(`
            <div class="step-item connector" id="${id}">
                <div class="step-drag-handle" title="드래그하여 순서 이동"><i class="fas fa-grip-vertical"></i></div>
                <div class="step-body">
                    <div class="step-message">
                        <span class="step-message-type message-in">IN</span>
                        <span class="step-message-id" name="view-requestMessageId">${data.requestMessageId||''}</span>
                    </div>
                    <div class="step-function">
                        <span class="step-function-img">
                            <img name="view-functionType" src="${getFunctionIconPath(data.functionType)}" width="44" height="44" style="display:block;">
                        </span>
                        <span class="step-function-name">
                            <font class="function-display-name" name="view-displayName">${data.displayName||''}</font>
                            <font class="function-name" name="view-functionName">${data.functionName||''}</font>
                        </span>
                    </div>
                    <div class="step-message">
                        <span class="step-message-type message-out">OUT</span>
                        <span class="step-message-id" name="view-responseMessageId">${data.responseMessageId||''}</span>
                    </div>
                </div>
                <span class="step-tools">
                    <i class="step-tool fas fa-trash" title="삭제"></i>
                </span>
            </div>
        `);

        stepItemEl.find('.step-tool').on('click', function(e) {
            e.stopPropagation();
            deleteFunction(id);
        });

        // 단일클릭은 상세창을, 더블클릭은 기능 설정 팝업을 열어야 하는데
        // 브라우저는 더블클릭 시에도 click 이벤트를 먼저 발생시키므로
        // 지연 타이머로 두 동작이 동시에 뜨는 충돌을 막는다.
        stepItemEl.on('click', function() {
            const $this = $(this);
            clearTimeout($this.data('clickTimer'));
            $this.data('clickTimer', setTimeout(function() {
                openNodeDrawer(id);
            }, STEP_CLICK_DELAY));
        });

        stepItemEl.on('dblclick', function(e) {
            // step-function 영역(아이콘/기능명)을 더블클릭했을 때만 상세 팝업을 연다.
            // step-message(IN/OUT) 영역 더블클릭은 무시하고 일반 단일클릭(상세창 열기)으로 처리한다.
            if (!$(e.target).closest('.step-function').length) return;

            e.preventDefault();
            const $this = $(this);
            clearTimeout($this.data('clickTimer'));

            const d = getStepItemData(id);
            if (d) openPopupFunctionSetting(d.functionType, d.functionName);
        });

        return stepItemEl;
    }

    function addStepItem() {
        openFunctionTypeModal(null, function(selectedCode) {
            const orderNum = getLastStepOrder()+1;
            const id = 'step-item-C'+orderNum;
            const data = {
                orderNum:Number(orderNum),
                functionType:selectedCode,
                functionName:"",
                displayName:"(기능생성필요)",
                requestMessageId:"",
                responseMessageId:""
            }

            $(".add-step-item").before(renderStepItem(id, data));
            setStepItemData(id, data);
            drawConnectors();

            openNodeDrawer(id);
            $("#drawerFunctionName").trigger('focus');
        });
    }

    function deleteFunction(itemId) {
        $(`#${itemId}`).remove();
        removeStepItemData(itemId);

        if (activeNodeId === itemId) {
            closeNodeDrawer();
        }

        drawConnectors();
    }

    function drawConnectors() {
        const steps = document.querySelectorAll('.connector');
        const svg = document.getElementById('connectorLayer');
        const grid = document.getElementById('workflowGrid');
        if (!svg || !grid) return;

        // svg의 height:100%는 flex 컨테이너(auto height)를 기준으로 정확히 계산되지 않아
        // 화살표가 중간에 잘리는 문제가 있어 실제 그리드 크기로 명시적으로 지정한다.
        // 주의: grid.scrollWidth/scrollHeight는 쓰면 안 된다 - svg 자신이 grid의 자식이라
        // 이전에 지정해둔 svg 크기가 grid의 스크롤 크기에 그대로 반영되어, 한 번 커지면
        // 다시 줄어들지 않는 자기증식 버그가 생긴다(사이드바 접었다 펴면 화살표가 어긋남).
        // absolute 포지션인 svg는 auto-height 계산에서 제외되므로 getBoundingClientRect가 안전하다.
        const gridRect = grid.getBoundingClientRect();
        svg.setAttribute('width', gridRect.width);
        svg.setAttribute('height', gridRect.height);

        const defs = svg.querySelector('defs');
        svg.innerHTML = '';
        if (defs) svg.appendChild(defs);

        steps.forEach((step, i) => {
            if(i === steps.length - 1) return; // 마지막은 연결 X

            const start = step.getBoundingClientRect();
            const end = steps[i + 1].getBoundingClientRect();
            const container = svg.getBoundingClientRect();

            // step-item은 왼쪽에 드래그 핸들(26px)이 붙어있어 카드 전체 폭 기준 중앙이
            // 실제 보이는 카드 내용(아이콘/텍스트) 중앙보다 왼쪽으로 치우친다.
            // add-step-item(+ 버튼)에는 핸들이 없으므로 step-body가 있으면 그것을 기준으로 삼는다.
            const startContent = step.querySelector('.step-body') || step;
            const endContent = steps[i + 1].querySelector('.step-body') || steps[i + 1];
            const x1 = startContent.getBoundingClientRect().left + startContent.getBoundingClientRect().width / 2 - container.left;
            const x2 = endContent.getBoundingClientRect().left + endContent.getBoundingClientRect().width / 2 - container.left;
            const y1 = start.bottom - container.top;
            const y2 = end.top - container.top;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke", "#c7cbd1");
            line.setAttribute("stroke-width", "2");
            line.setAttribute("marker-end", "url(#connectorArrow)");

            svg.appendChild(line);
        });
    }

    function getLastStepOrder() {
        const parent = document.querySelector('#workflowGrid');
        return parent.querySelectorAll('.step-item').length;
    }

    /* ================= Node detail drawer ================= */

    function openNodeDrawer(itemId) {
        activeNodeId = itemId;

        $(".step-item").removeClass("selected");
        $(`#${itemId}`).addClass("selected");

        refreshDrawerFields(getStepItemData(itemId) || {});

        $("#nodeDrawer").addClass("open");
        $("#drawerBackdrop").addClass("show");
    }

    function closeNodeDrawer() {
        activeNodeId = null;
        $(".step-item").removeClass("selected");
        $("#nodeDrawer").removeClass("open");
        $("#drawerBackdrop").removeClass("show");
    }

    function refreshDrawerFields(data) {
        const info = getFunctionTypeInfo(data.functionType) || {};
        $("#drawerTypeChip img").attr('src', info.icon || '');
        $("#drawerTypeChip span[name='chip-name']").text(info.name || '유형 선택');
        $("#drawerFunctionName").val(data.functionName || '');
        $("#drawerRequestMessageId").val(data.requestMessageId || '');
        $("#drawerResponseMessageId").val(data.responseMessageId || '');
    }

    function onDrawerFieldChange(field, value) {
        if (!activeNodeId) return;

        const data = getStepItemData(activeNodeId);
        if (!data) return;

        data[field] = value;
        setStepItemData(activeNodeId, data);
    }

    function openDrawerFunctionSetting() {
        if (!activeNodeId) return;
        const data = getStepItemData(activeNodeId);
        openPopupFunctionSetting(data.functionType, data.functionName);
    }

    function deleteFunctionFromDrawer() {
        if (!activeNodeId) return;
        deleteFunction(activeNodeId);
    }

    /* ================= Function type picker (layer popup) ================= */

    function openFunctionTypeModal(currentCode, onSelect) {
        const $list = $('#functionTypeList');
        $list.empty();

        for (const item of App.codes['FUNCTION_TYPE']) {
            const $item = $(`
                <div class="function-type-item ${item.code === currentCode ? 'current' : ''}">
                    <span class="function-type-icon"><img src="${item.icon}" width="40" height="40"></span>
                    <span class="function-type-info">
                        <span class="function-type-name">${item.name}<span class="function-type-code">${item.code}</span></span>
                        <span class="function-type-desc">${item.description}</span>
                    </span>
                </div>
            `);

            $item.on('click', function() {
                $('#functionTypeModal').modal('hide');
                onSelect(item.code);
            });

            $list.append($item);
        }

        $('#functionTypeModal').modal('show');
    }

    function openPopupFunctionSetting(type, functionName) {
        if(!functionName) {
            alert("기능코드를 입력해주세요.");
            return;
        }

        if(type === 'SQL') {
            App.modalPopup.open('/console/workflow-sql',{title:'SQL 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
        else if(type === 'ENTITY') {
            App.modalPopup.open('/console/workflow-entity',{title:'Entity 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
        else if(type === 'REST_CLIENT') {
            App.modalPopup.open('/console/workflow-restclient',{title:'Rest Client 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
        else if(type === 'MESSAGE_PROCESSOR') {
            App.modalPopup.open('/console/workflow-message',{title:'메시지 처리 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
        else if(type === 'NOTIFICATION') {
            App.modalPopup.open('/console/workflow-notification',{title:'알림 설정',size:"modal-fullscreen-md",height:"92vh",messageId:'FUNC_REQUEST'},{functionName:functionName});
        }
    }
</script>
<div th:fragment="view">
    <div class="wf-app">
        <aside class="wf-sidebar" id="wfSidebar">
            <div class="wf-sidebar-header">
                <button type="button" class="btn-new-workflow" onclick="newContent()">
                    <i class="fas fa-plus"></i> New Workflow
                </button>
                <div class="wf-search">
                    <input type="text" id="workflowSearch" placeholder="워크플로우 검색" autocomplete="off" oninput="renderWorkflowList()">
                    <i class="fas fa-sync-alt" title="새로고침" onclick="getWorkflowList()"></i>
                </div>
            </div>
            <div class="wf-list" id="workflowList"></div>
        </aside>

        <div class="wf-main">
            <div class="wf-topbar">
                <button type="button" class="wf-sidebar-toggle" onclick="toggleSidebar()" title="목록 접기/펼치기">
                    <i class="fas fa-bars"></i>
                </button>
                <input type="hidden" id="workflowId">
                <div class="wf-title-group">
                    <input type="text" id="workflowCode" class="wf-code-input" placeholder="workflow_code" autocomplete="off">
                    <input type="text" id="displayName" class="wf-name-input" placeholder="워크플로우 이름을 입력하세요" autocomplete="off">
                </div>
                <div class="wf-topbar-actions">
                    <button type="button" onclick="openSettingsModal()"><i class="fas fa-cog"></i> 설정</button>
                    <button type="button" onclick="openExecuteModal()"><i class="fas fa-play"></i> 실행</button>
                    <button type="button" onclick="restore()"><i class="fas fa-undo"></i> 복원</button>
                    <button type="button" class="btn-primary" onclick="save()"><i class="fas fa-save"></i> 저장</button>
                    <button type="button" class="btn-danger" onclick="deleteWorkflow()"><i class="fas fa-trash"></i> 삭제</button>
                </div>
            </div>

            <div class="wf-canvas-wrap">
                <div class="wf-canvas">
                    <div id="workflowGrid"></div>
                </div>

                <div class="wf-drawer-backdrop" id="drawerBackdrop" onclick="closeNodeDrawer()"></div>

                <aside class="wf-node-drawer" id="nodeDrawer">
                    <div class="wf-drawer-header">
                        <span style="font-weight:600;font-size:14px;">노드 설정</span>
                        <button type="button" class="wf-drawer-close" onclick="closeNodeDrawer()">&times;</button>
                    </div>
                    <div class="wf-drawer-body">
                        <div class="wf-field">
                            <label>기능 유형</label>
                            <button type="button" class="function-type-chip" id="drawerTypeChip">
                                <img name="chip-icon" src="" width="18" height="18">
                                <span name="chip-name">유형 선택</span>
                                <i class="fas fa-chevron-down"></i>
                            </button>
                        </div>
                        <div class="wf-field">
                            <label>기능코드</label>
                            <input type="text" id="drawerFunctionName" class="form-control form-control-sm" placeholder="기능코드 입력" autocomplete="off" oninput="onDrawerFieldChange('functionName', this.value)">
                        </div>
                        <div class="wf-field-row">
                            <div class="wf-field">
                                <label>요청메시지ID (IN)</label>
                                <input type="text" id="drawerRequestMessageId" class="form-control form-control-sm" placeholder="요청메시지ID" autocomplete="off" oninput="onDrawerFieldChange('requestMessageId', this.value)">
                            </div>
                            <div class="wf-field">
                                <label>응답메시지ID (OUT)</label>
                                <input type="text" id="drawerResponseMessageId" class="form-control form-control-sm" placeholder="응답메시지ID" autocomplete="off" oninput="onDrawerFieldChange('responseMessageId', this.value)">
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-block btn-sm" onclick="openDrawerFunctionSetting()">
                            <i class="fas fa-sliders-h"></i> 상세 설정 열기
                        </button>
                    </div>
                    <div class="wf-drawer-footer">
                        <button type="button" class="btn btn-outline-danger btn-block btn-sm" onclick="deleteFunctionFromDrawer()">
                            <i class="fas fa-trash"></i> 노드 삭제
                        </button>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <!-- Function type picker (layer popup) -->
    <div class="modal fade" id="functionTypeModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">기능 유형 선택</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="functionTypeList" class="function-type-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Workflow settings (auth / authority) -->
    <div class="modal fade" id="settingsModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">워크플로우 설정</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="wf-field" style="margin-bottom:18px;">
                        <label for="useAuthValidation">인증 사용</label>
                        <div class="custom-control custom-switch" style="transform: scale(1.3); transform-origin: left center;">
                            <input type="checkbox" class="custom-control-input" id="useAuthValidation">
                            <label for="useAuthValidation" class="custom-control-label" style="cursor:pointer;"></label>
                        </div>
                    </div>
                    <div class="wf-field">
                        <label>권한</label>
                        <div id="authorityChips" class="wf-authority-chips"></div>
                        <div class="wf-authority-add">
                            <select id="authoritySelect" class="form-control form-control-sm"></select>
                            <button type="button" class="btn btn-default btn-sm" onclick="addAuthorityChip()">추가</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Execute -->
    <div class="modal fade" id="executeModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">워크플로우 실행</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="wf-field">
                        <label style="display:flex;align-items:center;justify-content:space-between;">
                            요청 메시지
                            <button type="button" class="btn btn-default btn-sm" onclick="addExecuteRow()">
                                <i class="fas fa-plus"></i> 행 추가
                            </button>
                        </label>
                        <div id="executeRows"></div>
                    </div>
                    <div class="wf-field">
                        <label style="display:flex;align-items:center;justify-content:space-between;">
                            실행 결과
                            <button type="button" class="btn btn-default btn-sm" onclick="copyExecuteResult()">
                                <i class="fas fa-copy"></i> 복사
                            </button>
                        </label>
                        <textarea class="form-control wf-console-textarea" id="responseData" rows="10" readonly></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" onclick="execute()">
                        <i class="fas fa-play"></i> 실행
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
