<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<script th:fragment="script">
    App.codes = {
        "YN_CD":[
            {code:"true",name:"Y"},
            {code:"false",name:"N"}
        ],
        "METHOD":[
            {code:"GET",name:"GET"},
            {code:"POST",name:"POST"},
            {code:"PUT",name:"PUT"},
            {code:"DELETE",name:"DELETE"}
        ],
        "CONTENT_TYPE":[
            {code:"APPLICATION_JSON",name:"application/json"},
            {code:"APPLICATION_FORM_URLENCODED",name:"application/x-www-form-urlencoded"},
            {code:"TEXT_PLAIN",name:"text/plain"}
        ],
        "BODY_MESSAGE_FORMAT":[
            {code:"ARRAY",name:"Array"},
            {code:"OBJECT",name:"Object"}
        ],
        "REST_DATA_TYPE":[
            {code:"STRING",name:"String"},
            {code:"NUMBER",name:"Number"},
            {code:"BOOLEAN",name:"Boolean"},
            {code:"OBJECT",name:"Object"},
            {code:"ARRAY",name:"Array"}
        ],
        "VALUE_TYPE":[
            {code:"PARAM_VALUE",name:"파라미터값"},
            {code:"INPUT_VALUE",name:"입력값"},
            {code:"SESSION_USER_ID",name:"세션 유저 ID"}
        ]
    };

    let codes;
    let sqlEditor;
    let functionName;

    $( document ).ready(function() {
        init();
    });

    function init() {
        setDatSourceAsRestServer();
        App.util.setCodeBox("rest-client-method", App.codes['METHOD']);
        App.util.setCodeBox("rest-client-contentType", App.codes['CONTENT_TYPE']);
        App.util.setCodeBox("rest-client-bodyMessageFormat", App.codes['BODY_MESSAGE_FORMAT']);

        Sheet.initSheet('queryParamsGrid', "100%", "300px",
            {
                useSeq:true,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'id', label:'ID', type:'text', width:20, editable: false, align:'left', required:false, hide:true},
                {field:'paramName', label:'파라미터', type:'text', width:250, editable: true, align:'left', required:true},
                {field:'valueType', label:'값유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['VALUE_TYPE']},
                {field:'inputValue', label:'입력값', type:'text', width:250, editable: true, align:'left', required:false}
            ]);

        Sheet.initSheet('headersGrid', "100%", "300px",
            {
                useSeq:true,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'id', label:'ID', type:'text', width:20, editable: false, align:'left', required:false, hide:true},
                {field:'name', label:'Header 명', type:'text', width:250, editable: true, align:'left', required:true},
                {field:'valueType', label:'값유형', type:'combo', width:200, editable: true, align:'center', required:false, comboCodes:App.codes['VALUE_TYPE']},
                {field:'inputValue', label:'입력값', type:'text', width:250, editable: true, align:'left', required:false}
            ]);

        Sheet.initSheet('bodyGrid', "100%", "300px",
            {
                useSeq:true,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'id', label:'ID', type:'text', width:20, editable: false, align:'left', required:false, hide:true},
                {field:'paramName', label:'파라미터', type:'text', width:200, editable: true, align:'left', required:true},
                {field:'parentParamName', label:'부모 파라미터', type:'text', width:200, editable: true, align:'left', required:false},
                {field:'dataType', label:'데이터유형', type:'combo', width:100, editable: true, align:'center', required:false, comboCodes:App.codes['REST_DATA_TYPE']},
                {field:'orderNum', label:'순서', type:'number', width:100, editable: true, align:'center', required:false},
                {field:'valueType', label:'값유형', type:'combo', width:100, editable: true, align:'center', required:false, comboCodes:App.codes['VALUE_TYPE']},
                {field:'inputValue', label:'입력값', type:'text', width:200, editable: true, align:'left', required:false}
            ]);

        Sheet.initSheet('executeGrid', "100%", "250px",
            {
                useSeq:false,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'key', label:'파라미터', type:'text', width:400, editable: true, align:'left', required:false},
                {field:'value', label:'값', type:'text', width:400, editable: true, align:'left', required:false}
            ]);

        App.modalPopup.receiveParam('FUNC_REQUEST', function(data){
            if(!data.functionName) {
                alert('기능코드가 존재하지않습니다.');
            }

            functionName = data.functionName;
            getRestClient(functionName)
        });
    }

    function setDatSourceAsRestServer() {
        httpClient.get(`/console/api/datasource/rest-server`, {},
            function(response){
                let codes = new Array();
                for(let i=0; i<response.length; i++) {
                    codes.push({code:response[i].dataSourceName,name:response[i].displayName});
                }

                 App.util.setCodeBox("rest-client-dataSourceName", codes);
            },
            function(error){
                alert('error');
            }
        );
    }

    function execute() {
        let executeTarget = functionName;

        let contents = {};
        let gridData = grid.getSheetData("executeGrid");

        for(let i=0; i<gridData.length; i++) {
            let value = gridData[i]["value"];
            if(value == "null") {
                contents[gridData[i]["key"]] = null;
            }
            else {
                contents[gridData[i]["key"]] = value;
            }
        }

        httpClient.post(`/console/api/rest-client/${executeTarget}/execute`,contents, null,
            function(response){
                $("#responseData").val(JSON.stringify(response,null,3));
            },
            function(error){
                $("#responseData").val(JSON.stringify(error.responseJSON,null,3));
            }
        );

    }

        function getRestClient(clientName) {
            httpClient.get(`/console/api/rest-client`, {clientName:clientName},
                function(response){
                    if(response[0]) {
                        setRestClientContent(response[0]);
                    }
                    else {
                        newRestClientContent(clientName);
                    }
                },
                function(error){
                    alert('error');
                }
            );
        }

        function getRestClientContent() {
            return {
                id: $("#rest-client-id").val(),
                clientName: $("#rest-client-clientName").val(),
                displayName: $("#rest-client-displayName").val(),
                dataSourceName: $("#rest-client-dataSourceName").val(),
                method: $("#rest-client-method").val(),
                path: $("#rest-client-path").val(),
                contentType: $("#rest-client-contentType").val(),
                bodyMessageFormat: $("#rest-client-bodyMessageFormat").val()
            }
        }

        function setRestClientContent(params) {
            $("#rest-client-id").val(params.id);
            $("#rest-client-clientName").val(params.clientName);
            $("#rest-client-displayName").val(params.displayName);
            $("#rest-client-dataSourceName").val(params.dataSourceName);
            $("#rest-client-method").val(params.method);
            $("#rest-client-path").val(params.path);
            $("#rest-client-contentType").val(params.contentType);
            $("#rest-client-bodyMessageFormat").val(params.bodyMessageFormat);
            queryParamsGrid.setSheetData(params.queryParams);
            headersGrid.setSheetData(params.headers);
            bodyGrid.setSheetData(params.body);
          }

          function newRestClientContent(clientName){
            setRestClientContent({
                id:'',
                clientName:clientName,
                displayName:'',
                dataSourceName:'',
                method:'',
                path:'',
                contentType:'',
                bodyMessageFormat:'',
                queryParams:[],
                headers:[],
                body:[]
                });
          }

        function save() {
            httpClient.post(`/console/api/rest-client/save`,
                {},
                {
                    'restClient':getRestClientContent(),
                    'queryParams':"",
                    'headers':"",
                    'body':""
                },
                function(response){
                    alert("저장완료되었습니다.");
                    getRestClient();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function newRowQueryParams() {
            queryParamsGrid.addRowData({
                paramName:"(파라미터)",
                valueType:"PARAM_VALUE",
                inputValue:""
            });
        }

        function newRowHeaders() {
            headersGrid.addRowData({
                name:"(Header 명)",
                valueType:"PARAM_VALUE",
                inputValue:""
            });
        }

        function newRowBody() {
            bodyGrid.addRowData({
                paramName:"(파라미터)",
                parentParamName:"ROOT",
                dataType:"STRING",
                valueType:"PARAM_VALUE",
                inputValue:"",
                orderNum:1
            });
        }
</script>
<div th:fragment="view">
    <div class="card">
        <div class="card-header p-0 border-bottom-0">
            <ul class="nav nav-tabs" id="detail-tab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="workflow-def-tab" data-toggle="pill" href="#workflow-def" role="tab" aria-controls="workflow-def" aria-selected="true">
                        Definition
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="execute-tab" data-toggle="pill" href="#execute" role="tab" aria-controls="execute" aria-selected="false">
                        Execute
                    </a>
                </li>
            </ul>
        </div>
        <div class="card-body">
            <div class="tab-content" id="detail-tabContent" >

                <div class="tab-pane fade show active" id="workflow-def" role="tabpanel" aria-labelledby="workflow-def-tab">
                    <div class="card-body">
                        <div class="row">
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="save()" >
                                    <i class="btn-icon fas fa-save"></i>
                                    <span class="btn-label">Save</span>
                                </button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-1 d-none">
                                <label for="rest-client-id">ID</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="rest-client-id" autocomplete="off" >
                            </div>
                            <div class="form-group col-3">
                                <label for="rest-client-clientName">Rest Client</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="rest-client-clientName" autocomplete="off" disabled>
                            </div>
                            <div class="form-group col-3">
                                <label for="rest-client-displayName">화면노출명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="rest-client-displayName" autocomplete="off">
                            </div>
                            <div class="form-group col-3">
                                <label for="rest-client-dataSourceName">데이터소스</label>
                                <select class="form-control form-control-sm" id="rest-client-dataSourceName" >
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-3">
                                <label for="rest-client-method">Method</label>
                                <select class="form-control form-control-sm" id="rest-client-method" >
                                </select>
                            </div>
                            <div class="form-group col-3">
                                <label for="rest-client-path">Path</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="rest-client-path" autocomplete="off" >
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-3">
                                <label for="rest-client-contentType">Content-Type</label>
                                <select class="form-control form-control-sm" id="rest-client-contentType" >
                                </select>
                            </div>
                            <div class="form-group col-3">
                                <label for="rest-client-bodyMessageFormat">Body 포맷</label>
                                <select class="form-control form-control-sm" id="rest-client-bodyMessageFormat" >
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="tab-content">
                        <div class="card-header p-0 border-bottom-0">
                            <ul class="nav nav-tabs" id="rest-client-tab" role="tablist">
                                <li class="nav-item">
                                    <a class="nav-link active" id="query-params-tab" data-toggle="pill" href="#query-params" role="tab" aria-controls="query-params" aria-selected="true">
                                        Query Params
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" id="headers-tab" data-toggle="pill" href="#headers" role="tab" aria-controls="headers" aria-selected="false">
                                        Headers
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" id="body-tab" data-toggle="pill" href="#body" role="tab" aria-controls="body" aria-selected="false">
                                        Body
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <div class="tab-pane fade show active" id="query-params" role="tabpanel" aria-labelledby="query-params-tab">
                            <div class="row">
                                <div style=" display: flex; margin-left: auto;">
                                    <button type="button" class="btn btn-default btn-sm" onclick="newRowQueryParams()" >
                                        <i class="btn-icon fas fa-plus"></i>
                                        <span class="btn-label">Add</span>
                                    </button>
                                </div>
                                <div id="queryParamsGrid"></div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="headers" role="tabpanel" aria-labelledby="headers-tab">
                            <div class="row">
                                <div style=" display: flex; margin-left: auto;">
                                    <button type="button" class="btn btn-default btn-sm" onclick="newRowHeaders()" >
                                        <i class="btn-icon fas fa-plus"></i>
                                        <span class="btn-label">Add</span>
                                    </button>
                                </div>
                                <div id="headersGrid"></div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="body" role="tabpanel" aria-labelledby="body-tab">
                            <div class="row">
                                <div style=" display: flex; margin-left: auto;">
                                    <button type="button" class="btn btn-default btn-sm" onclick="newRowBody()" >
                                        <i class="btn-icon fas fa-plus"></i>
                                        <span class="btn-label">Add</span>
                                    </button>
                                </div>
                                <div id="bodyGrid"></div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="tab-pane fade" id="execute" role="tabpanel" aria-labelledby="execute-tab">
                    <div class="card-body">
                        <div class="row">
                            <label>SQL 파라미터</label>
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="executeGrid.addRowData()" >
                                    <i class="btn-icon fas fa-plus"></i>
                                    <span class="btn-label">Add</span>
                                </button>
                                <button type="button" class="btn btn-success btn-sm" onclick="execute()" >
                                    <i class="btn-icon fas fa-play"></i>
                                    <span class="btn-label">Run</span>
                                </button>
                            </div>
                            <div id="executeGrid"></div>
                        </div>
                        <div class="row">
                            <label>실행 결과</label>
                            <textarea class="col-12" id="responseData"  rows="15" ></textarea>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</html>
