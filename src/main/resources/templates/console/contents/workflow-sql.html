<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<script th:fragment="script">
    App.codes = {
        "YN_CD":[
            {code:"true",name:"Y"},
            {code:"false",name:"N"}
        ],
        "PARAM_TYPE":[
            {code:"STRING",name:"String"},
            {code:"NUMBER",name:"Number"},
            {code:"DATE",name:"Date"}
        ],
        "IN_OUT":[
            {code:"IN",name:"IN"},
            {code:"OUT",name:"OUT"}
        ],
        "AUTO_VALUE_TYPE":[
            {code:"DEFAULT",name:"기본"},
            {code:"STATIC_VALUE",name:"static 값"},
            {code:"RESERVED_WORD",name:"예약어"}
        ],
        "COLUMN_TYPE":[
            {code:"STRING",name:"String"},
            {code:"NUMBER",name:"Number"},
            {code:"DATE",name:"Date"},
            {code:"DATETIME",name:"Datetime"}
        ]
    };

    let codes;
    let sqlEditor;
    let functionName;

    $( document ).ready(function() {
        init();
    });

    function init() {
        setDatSourceAsDatabase();

        sqlEditor = initCodeEditor('query','text/x-sql');
        sqlEditor.setSize("100%", "500px");

        Sheet.initSheet('queryParameterGrid', "100%", "300px",
            {
                useSeq:true,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'queryParameterId', label:'ID', type:'text', width:20, editable: false, align:'left', required:false, hide:true},
                {field:'paramName', label:'파라미터명', type:'text', width:250, editable: true, align:'left', required:true},
                {field:'paramType', label:'타입', type:'combo', width:150, editable: true, align:'center', required:true, comboCodes:App.codes['PARAM_TYPE']},
                {field:'autoValueType', label:'자동값유형', type:'combo', width:150, editable: true, align:'center', required:true, comboCodes:App.codes['AUTO_VALUE_TYPE']},
                {field:'inOut', label:'IN/OUT', type:'combo', width:150, editable: true, align:'center', required:true, comboCodes:App.codes['IN_OUT']}
            ]);

        Sheet.initSheet('executeGrid', "100%", "250px",
            {
                useSeq:false,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'key', label:'파라미터', type:'text', width:400, editable: true, align:'left', required:false},
                {field:'value', label:'값', type:'text', width:400, editable: true, align:'left', required:false}
            ]);

        App.modalPopup.receiveParam('FUNC_REQUEST', function(data){
            if(!data.functionName) {
                alert('기능코드가 존재하지않습니다.');
            }

            functionName = data.functionName;
            getQuery(functionName);
        });
    }

    function newParameter() {
        queryParameterGrid.addRowData({
            paramName:"(파라미터명)",
            paramType:"STRING",
            autoValueType:"DEFAULT",
            inOut:"IN"
        });
    }

    function initCodeEditor(id,mode) {
        let textarea = document.getElementById(id);

        return CodeMirror.fromTextArea(textarea, {
            lineNumbers: true,
            lineWrapping: true,
            theme: "darcula",
            mode: mode,
            val: textarea.value
        });
    }

    function setDatSourceAsDatabase() {
        httpClient.get(`/console/api/datasource/database`, {},
            function(response){
                let codes = new Array();
                for(let i=0; i<response.length; i++) {
                    codes.push({code:response[i].dataSourceName,name:response[i].displayName});
                }

                App.util.setCodeBox("query-dataSourceName", codes);
                App.util.setCodeBox("entity-dataSourceName", codes);
            },
            function(error){
                alert('error');
            }
        );
    }

    function execute() {
        let executeTarget = $("#query-queryName").val();

        let contents = {};
        const gridData = executeGrid.getSheetData();

        for(const data of gridData) {
            if(data.value == "null") {
                contents[data.key] = null;
            }
            else {
                contents[data.key] = data.value;
            }
        }

        httpClient.get(`/console/api/query/${executeTarget}/execute`,contents,
            function(response){
                $("#responseData").val(JSON.stringify(response,null,3));
            },
            function(error){
                $("#responseData").val(JSON.stringify(error.responseJSON,null,3));
            }
        );

    }

    function getQuery(functionName) {
        httpClient.get(`/console/api/query`, {queryName:`${functionName}`},
            function(response){
                let data = response[0];
                if(data) {
                    setQueryContent(data);

                    for(let queryParam of data.queryParams) {
                        queryParam._status = 'C';
                    }
                    queryParameterGrid.setSheetData(data.queryParams);
                }
                else {
                    setQueryContent({
                        id:'',
                        queryName:functionName,
                        displayName:'',
                        dataSourceName:'',
                        query:'',
                    });
                    queryParameterGrid.setSheetData([]);
                }
            },
            function(error){
                alert('error');
            }
        );
    }

    function setQueryContent(response) {
        setQueryContent({
            id:response.id,
            queryName:response.queryName,
            displayName:response.displayName,
            dataSourceName:response.dataSourceName,
            query:response.query
          });
    }

    function getQueryContent() {
        return {
            id: $("#query-id").val(),
            queryName: $("#query-queryName").val(),
            displayName: $("#query-displayName").val(),
            dataSourceName: $("#query-dataSourceName").val(),
            query: sqlEditor.getValue()
        }
    }

    function setQueryContent(params) {
        $("#query-id").val(params.id);
        $("#query-queryName").val(params.queryName);
        $("#query-displayName").val(params.displayName);
        $("#query-dataSourceName").val(params.dataSourceName);
        sqlEditor.setValue(params.query);
    }

    function save() {
        httpClient.post(`/console/api/query/save`,{},
            {
                query:getQueryContent(),
                queryParams:queryParameterGrid.getSheetData()
            },
            function(response){
                alert("저장완료되었습니다.");
                getQuery($("#query-queryName").val());
            },
            function(error){
                alert('error');
            }
        );
    }

    function deleteQuery() {
      let id = $("#query-id").val();

      httpClient.delete(`/console/api/query/${id}`, {},
          function(response){
              alert("삭제 되었습니다.");
              getQuery($("#query-queryName").val());
          },
          function(error){
              alert('error');
          }
      );
    }
</script>
<div th:fragment="view">
    <div class="card">
        <div class="card-header p-0 border-bottom-0">
            <ul class="nav nav-tabs" id="detail-tab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="workflow-def-tab" data-toggle="pill" href="#workflow-def" role="tab" aria-controls="workflow-def" aria-selected="true">
                        Definition
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="execute-tab" data-toggle="pill" href="#execute" role="tab" aria-controls="execute" aria-selected="false">
                        Execute
                    </a>
                </li>
            </ul>
        </div>
        <div class="card-body">
            <div class="tab-content" id="detail-tabContent" >

                <div class="tab-pane fade show active" id="workflow-def" role="tabpanel" aria-labelledby="workflow-def-tab">

                    <div class="card-body">
                        <div class="row">
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="save()" >
                                    <i class="btn-icon fas fa-save"></i>
                                    <span class="btn-label">Save</span>
                                </button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-1 d-none">
                                <label for="query-id">ID</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="query-id" autocomplete="off" >
                            </div>
                            <div class="form-group col-3">
                                <label for="query-queryName">쿼리명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="query-queryName" autocomplete="off" disabled>
                            </div>
                            <div class="form-group col-3">
                                <label for="query-displayName">화면노출명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="query-displayName" autocomplete="off">
                            </div>
                            <div class="form-group col-3">
                                <label for="query-dataSourceName">데이터소스</label>
                                <select class="form-control form-control-sm" id="query-dataSourceName" >
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-12">
                                <label>SQL</label>
                                <textarea id="query" name="query" rows="60" style="display:none;"></textarea>
                            </div>
                        </div>
                        <div class="row">
                            <label>SQL 파라미터</label>
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="newParameter()" >
                                    <i class="btn-icon fas fa-plus"></i>
                                    <span class="btn-label">Add</span>
                                </button>
                            </div>
                            <div id="queryParameterGrid"></div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="execute" role="tabpanel" aria-labelledby="execute-tab">
                    <div class="card-body">
                        <div class="row">
                            <label>SQL 파라미터</label>
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="executeGrid.addRowData()" >
                                    <i class="btn-icon fas fa-plus"></i>
                                    <span class="btn-label">Add</span>
                                </button>
                                <button type="button" class="btn btn-success btn-sm" onclick="execute()" >
                                    <i class="btn-icon fas fa-play"></i>
                                    <span class="btn-label">Run</span>
                                </button>
                            </div>
                            <div id="executeGrid"></div>
                        </div>
                        <div class="row">
                            <label>실행 결과</label>
                            <textarea class="col-12" id="responseData"  rows="15" ></textarea>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</html>
