<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
    #authority-app {
        padding: 16px;
        background: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
    }

    #authority-app .ds-layout {
        display: flex;
        align-items: flex-start;
        gap: 16px;
    }

    #authority-app .ds-list-panel,
    #authority-app .ds-detail-panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
    }

    #authority-app .ds-list-panel {
        flex: 0 0 360px;
        display: flex;
        flex-direction: column;
    }

    #authority-app .ds-detail-panel {
        flex: 1 1 auto;
        min-width: 0;
    }

    #authority-app .ds-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
        flex-wrap: wrap;
    }

    #authority-app .ds-panel-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #1f2937;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #authority-app .ds-panel-header h3 i {
        color: #4A90E2;
    }

    #authority-app .ds-panel-tools {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #authority-app .ds-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7dbe0;
        background: #fff;
        color: #374151;
        border-radius: 7px;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #authority-app .ds-btn:hover {
        background: #f1f3f5;
    }

    #authority-app .ds-btn-primary {
        background: #4A90E2;
        border-color: #4A90E2;
        color: #fff;
    }

    #authority-app .ds-btn-primary:hover {
        background: #3d7fce;
    }

    #authority-app .ds-btn-danger {
        color: #dc2626;
    }

    #authority-app .ds-btn-danger:hover {
        background: #fef2f2;
    }

    /* ---- 목록: ag-Grid 대신 검색+카드형 리스트로 직접 렌더링 ---- */
    #authority-app .ds-list-search {
        position: relative;
        padding: 10px 12px;
        border-bottom: 1px solid #eef0f2;
    }

    #authority-app .ds-list-search i {
        position: absolute;
        left: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #9199a3;
        font-size: 12px;
        pointer-events: none;
    }

    #authority-app .ds-list-search input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 10px 7px 28px;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 12.5px;
    }

    #authority-app .ds-list-search input:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    #authority-app .ds-list-body {
        max-height: 560px;
        min-height: 200px;
        overflow-y: auto;
    }

    #authority-app .ds-list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-bottom: 1px solid #f1f3f5;
        border-left: 3px solid transparent;
        cursor: pointer;
        transition: background-color .12s ease;
    }

    #authority-app .ds-list-item:hover {
        background: #fafbfc;
    }

    #authority-app .ds-list-item.selected {
        background: #eef5ff;
        border-left-color: #4A90E2;
    }

    #authority-app .ds-list-item-main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #authority-app .ds-list-item-name {
        font-size: 13px;
        font-weight: 600;
        color: #1f2937;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #authority-app .ds-list-item.selected .ds-list-item-name {
        color: #1d4ed8;
    }

    #authority-app .ds-list-item-code {
        font-size: 11px;
        color: #9199a3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    #authority-app .ds-list-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 50px 16px;
        color: #9199a3;
        font-size: 12.5px;
        text-align: center;
    }

    #authority-app .ds-list-empty i {
        font-size: 22px;
        color: #d7dbe0;
    }

    /* ---- 탭 ---- */
    #authority-app .ds-tabs {
        display: flex;
        gap: 2px;
        padding: 8px 16px 0;
        background: #fbfbfc;
        border-bottom: 1px solid #eef0f2;
    }

    #authority-app .ds-tabs .nav-link {
        border: none;
        border-radius: 7px 7px 0 0;
        padding: 8px 16px;
        font-size: 12.5px;
        font-weight: 600;
        color: #6b7280;
        background: transparent;
    }

    #authority-app .ds-tabs .nav-link.active {
        background: #fff;
        color: #1d4ed8;
        box-shadow: inset 0 -2px 0 #4A90E2;
    }

    #authority-app .ds-tab-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid #eef0f2;
    }

    #authority-app .ds-tab-toolbar h4 {
        margin: 0;
        font-size: 12.5px;
        font-weight: 700;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    /* ---- 상세 설정 ---- */
    #authority-app .ds-detail-body {
        padding: 16px;
    }

    #authority-app .ds-section-grid {
        display: flex;
        flex-wrap: wrap;
    }

    #authority-app .ds-section-grid .form-group {
        padding: 0 6px;
        margin-bottom: 14px;
    }

    #authority-app .ds-section-grid label {
        font-size: 11.5px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 5px;
        display: block;
    }

    #authority-app .ds-section-grid .form-control {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
        background: #fff;
        color: #1f2937;
    }

    #authority-app .ds-section-grid .form-control:focus {
        border-color: #4A90E2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, .12);
        outline: none;
    }

    /* ---- 관계 편집기(메뉴접근권한) ---- */
    #authority-app .rel-body {
        padding: 16px;
    }

    #authority-app .rel-add-form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        flex-wrap: wrap;
        padding: 12px;
        background: #fbfbfc;
        border: 1px solid #eef0f2;
        border-radius: 8px;
        margin-bottom: 12px;
    }

    #authority-app .rel-add-form .form-group {
        margin-bottom: 0;
    }

    #authority-app .rel-add-form label {
        font-size: 11px;
        font-weight: 600;
        color: #6b7280;
        margin-bottom: 4px;
        display: block;
    }

    #authority-app .rel-add-form .form-control {
        border: 1px solid #d7dbe0;
        border-radius: 7px;
        font-size: 13px;
        padding: 6px 10px;
    }

    #authority-app .rel-add-actions {
        display: flex;
        gap: 6px;
        margin-left: auto;
    }

    #authority-app .rel-list {
        border: 1px solid #eef0f2;
        border-radius: 8px;
        overflow: hidden;
    }

    #authority-app .rel-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid #f1f3f5;
    }

    #authority-app .rel-row:last-child {
        border-bottom: none;
    }

    #authority-app .rel-row:hover {
        background: #fafbfc;
    }

    #authority-app .rel-row-main {
        flex: 1 1 auto;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    #authority-app .rel-row-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #authority-app .rel-field-label {
        font-size: 10px;
        color: #9199a3;
        text-transform: uppercase;
        letter-spacing: .03em;
    }

    #authority-app .rel-field-value {
        color: #1f2937;
        font-weight: 600;
        font-size: 12.5px;
    }

    #authority-app .rel-row-actions {
        display: flex;
        gap: 4px;
        flex: 0 0 auto;
    }

    #authority-app .rel-icon-btn {
        border: 1px solid #d7dbe0;
        background: #fff;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #374151;
        font-size: 11px;
    }

    #authority-app .rel-icon-btn:hover {
        background: #f1f3f5;
    }

    #authority-app .rel-icon-btn.danger {
        color: #dc2626;
    }

    #authority-app .rel-icon-btn.danger:hover {
        background: #fef2f2;
    }

    #authority-app .rel-empty {
        padding: 24px;
        text-align: center;
        color: #9199a3;
        font-size: 12.5px;
    }
</style>
<script th:fragment="script">
        let AUTHORITY_LIST = [];
        let SELECTED_AUTHORITY_ID = null;
        let MENU_AUTHORITY_LIST = [];
        let MENU_AUTHORITY_EDIT_ID = null;

        $( document ).ready(function() {
            console.log('version.0.0.4');
            init();
        });

        function init() {
            getList();
        }

        function getList() {
            httpClient.get(`/console/api/authority`, {},
                function(response){
                    AUTHORITY_LIST = response || [];
                    renderAuthorityList($("#authoritySearch").val());
                },
                function(error){
                    alert('error');
                }
            );
        }

        function renderAuthorityList(keyword) {
            const kw = (keyword || '').trim().toLowerCase();
            const filtered = AUTHORITY_LIST.filter(function(item) {
                if(!kw) return true;
                return (item.code || '').toLowerCase().includes(kw)
                    || (item.name || '').toLowerCase().includes(kw);
            });

            const $body = $("#authorityListBody");
            $body.empty();

            if(filtered.length === 0) {
                const $empty = $(`
                    <div class="ds-list-empty">
                        <i class="fas fa-inbox"></i>
                        <span></span>
                    </div>
                `);
                $empty.find('span').text(AUTHORITY_LIST.length === 0 ? '등록된 권한이 없습니다.' : '검색 결과가 없습니다.');
                $body.append($empty);
                return;
            }

            for(const item of filtered) {
                const $item = $(`
                    <div class="ds-list-item" data-id="${item.id}">
                        <div class="ds-list-item-main">
                            <span class="ds-list-item-name"></span>
                            <span class="ds-list-item-code"></span>
                        </div>
                    </div>
                `);

                $item.find('.ds-list-item-name').text(item.name || item.code);
                $item.find('.ds-list-item-code').text(item.code);

                if(String(item.id) === String(SELECTED_AUTHORITY_ID)) {
                    $item.addClass('selected');
                }

                $item.on('click', function() {
                    selectAuthority(item.id);
                });

                $body.append($item);
            }
        }

        function selectAuthority(id) {
            const item = AUTHORITY_LIST.find(a => String(a.id) === String(id));
            if(!item) return;

            SELECTED_AUTHORITY_ID = id;
            $("#authorityListBody .ds-list-item").removeClass('selected');
            $(`#authorityListBody .ds-list-item[data-id="${id}"]`).addClass('selected');

            selectedContent(item);
        }

        function selectedContent(item) {
            httpClient.get(`/console/api/authority/${item.id}`, {},
                function(response){
                    setContentData(response);
                    getMenuAuthority(response.code);
                },
                function(error){
                    alert('error');
                }
            );
        }

        function isEmpty(v) {
            return (v == undefined || v == null || v == '');
        }

        function save() {
            let id = $("#id").val();

            if(isEmpty(id))
                insertContent();
            else
                updateContent(id);
        }

        function insertContent() {
            httpClient.post(`/console/api/authority`,{},getContent(),
                function(response){
                    alert("저장완료되었습니다.");
                    getList();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function updateContent(id) {
          httpClient.put(`/console/api/authority/${id}`, {}, getContent(),
              function(response){
                  alert("저장완료되었습니다.");
                  getList();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function deleteContent() {
          let id = $("#id").val();

          httpClient.delete(`/console/api/authority/${id}`, {},
              function(response){
                  alert("삭제 처리 완료되었습니다.");
                  SELECTED_AUTHORITY_ID = null;
                  getList();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function setContentData(response) {
            setContent({
                id:response.id,
                code:response.code,
                name:response.name
              });
        }

        function getContent() {
            return {
                id: $("#id").val(),
                code: $("#code").val(),
                name: $("#name").val()
            }
        }

        function setContent(params) {
            $("#id").val(params.id);
            $("#code").val(params.code);
            $("#name").val(params.name);
          }

          function newContent(){
            SELECTED_AUTHORITY_ID = null;
            $("#authorityListBody .ds-list-item").removeClass('selected');
            MENU_AUTHORITY_LIST = [];
            renderMenuAuthorityList();

            setContent({
                id:'',
                code:'',
                name:''
              });
          }


        function getMenuAuthority(authorityCode) {
            httpClient.get(`/console/api/menu-authority`, {authorityCode:authorityCode},
                function(response){
                    let menuData = new Array();
                    for (i = 0; i < response.length; i++) {
                        menuData.push({
                            id:response[i].id,
                            menuCd:response[i].menu.menuCd
                        });
                    };

                    MENU_AUTHORITY_LIST = menuData;
                    renderMenuAuthorityList();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function renderMenuAuthorityList() {
            const $body = $("#menuAuthorityList");
            $body.empty();

            if(MENU_AUTHORITY_LIST.length === 0) {
                $body.append('<div class="rel-empty">등록된 메뉴접근권한이 없습니다.</div>');
                return;
            }

            for(const item of MENU_AUTHORITY_LIST) {
                const $row = $(`
                    <div class="rel-row" data-id="${item.id}">
                        <div class="rel-row-main">
                            <div class="rel-row-field"><span class="rel-field-label">Root 메뉴</span><span class="rel-field-value ma-menu-cd"></span></div>
                        </div>
                        <div class="rel-row-actions">
                            <button type="button" class="rel-icon-btn" title="수정"><i class="fas fa-pen"></i></button>
                            <button type="button" class="rel-icon-btn danger" title="삭제"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                `);

                $row.find('.ma-menu-cd').text(item.menuCd);

                $row.find('.rel-icon-btn:not(.danger)').on('click', function() {
                    editMenuAuthority(item.id);
                });
                $row.find('.rel-icon-btn.danger').on('click', function() {
                    if(confirm('삭제하시겠습니까?')) {
                        deleteMenuAuthority($("#code").val(), item);
                    }
                });

                $body.append($row);
            }
        }

        function editMenuAuthority(id) {
            const item = MENU_AUTHORITY_LIST.find(a => String(a.id) === String(id));
            if(!item) return;

            MENU_AUTHORITY_EDIT_ID = id;
            $("#maMenuCdInput").val(item.menuCd);
            $("#maSubmitBtn").html('<i class="fas fa-check"></i>수정');
            $("#maCancelBtn").removeClass('d-none');
        }

        function cancelMenuAuthorityEdit() {
            MENU_AUTHORITY_EDIT_ID = null;
            $("#maMenuCdInput").val('');
            $("#maSubmitBtn").html('<i class="fas fa-plus"></i>추가');
            $("#maCancelBtn").addClass('d-none');
        }

        function submitMenuAuthority() {
            const authorityCode = $("#code").val();
            if(!authorityCode) {
                alert('먼저 권한을 저장해주세요.');
                return;
            }

            const menuCd = $("#maMenuCdInput").val();
            if(!menuCd) {
                alert('Root 메뉴 코드를 입력해주세요.');
                return;
            }

            if(MENU_AUTHORITY_EDIT_ID) {
                updateMenuAuthority(authorityCode, {id:MENU_AUTHORITY_EDIT_ID, menuCd});
            }
            else {
                insertMenuAuthority(authorityCode, {menuCd});
            }

            cancelMenuAuthorityEdit();
        }

        function insertMenuAuthority(authorityCode, item) {
            httpClient.post(`/console/api/menu-authority`,{},
                {
                   menuCd:item.menuCd,
                   authorityCode:authorityCode
                },
                function(response){
                    getMenuAuthority(authorityCode);
                },
                function(error){
                    alert('error');
                }
            );
        }

        function updateMenuAuthority(authorityCode, item) {
          httpClient.put(`/console/api/menu-authority/${item.id}`, {},
              {
                   menuCd:item.menuCd,
                   authorityCode:authorityCode
              },
              function(response){
                  getMenuAuthority(authorityCode);
              },
              function(error){
                  alert('error');
              }
          );
        }

        function deleteMenuAuthority(authorityCode, item) {
          httpClient.delete(`/console/api/menu-authority/${item.id}`, {},
              function(response){
                  getMenuAuthority(authorityCode);
              },
              function(error){
                  alert('error');
              }
          );
        }
    </script>
<div id="authority-app" th:fragment="view">
    <div class="ds-layout">
        <aside class="ds-list-panel">
            <div class="ds-panel-header">
                <h3><i class="fas fa-user-shield"></i> 권한 목록</h3>
                <div class="ds-panel-tools">
                    <button type="button" class="ds-btn" onclick="getList()"><i class="fas fa-sync-alt"></i>새로고침</button>
                </div>
            </div>
            <div class="ds-list-search">
                <i class="fas fa-search"></i>
                <input type="text" id="authoritySearch" placeholder="코드, 명칭으로 검색" oninput="renderAuthorityList(this.value)">
            </div>
            <div class="ds-list-body" id="authorityListBody"></div>
        </aside>

        <section class="ds-detail-panel">
            <ul class="nav ds-tabs" id="authority-tab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="authority-detail-tab" data-toggle="pill" href="#authority-detail" role="tab" aria-controls="authority-detail" aria-selected="true">상세내용</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="menu-authority-tab" data-toggle="pill" href="#menu-authority" role="tab" aria-controls="menu-authority" aria-selected="false">메뉴접근권한</a>
                </li>
            </ul>
            <div class="tab-content" id="authority-tabContent">
                <div class="tab-pane fade show active" id="authority-detail" role="tabpanel" aria-labelledby="authority-detail-tab">
                    <div class="ds-tab-toolbar">
                        <h4>상세 내용</h4>
                        <div class="ds-panel-tools">
                            <button type="button" class="ds-btn" onclick="newContent()"><i class="fas fa-plus"></i>신규</button>
                            <button type="button" class="ds-btn ds-btn-primary" onclick="save()"><i class="fas fa-save"></i>저장</button>
                            <button type="button" class="ds-btn ds-btn-danger" onclick="deleteContent()"><i class="fas fa-trash"></i>삭제</button>
                        </div>
                    </div>
                    <div class="ds-detail-body">
                        <input type="hidden" id="id">
                        <div class="ds-section-grid">
                            <div class="form-group col-4">
                                <label for="code">코드</label>
                                <input type="text" class="form-control" id="code" autocomplete="off">
                            </div>
                            <div class="form-group col-4">
                                <label for="name">명칭</label>
                                <input type="text" class="form-control" id="name" autocomplete="off">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" id="menu-authority" role="tabpanel" aria-labelledby="menu-authority-tab">
                    <div class="ds-tab-toolbar">
                        <h4>메뉴접근권한</h4>
                    </div>
                    <div class="rel-body">
                        <div class="rel-add-form">
                            <div class="form-group">
                                <label for="maMenuCdInput">Root 메뉴 코드</label>
                                <input type="text" class="form-control" id="maMenuCdInput" style="width:220px;">
                            </div>
                            <div class="rel-add-actions">
                                <button type="button" class="ds-btn ds-btn-primary" id="maSubmitBtn" onclick="submitMenuAuthority()"><i class="fas fa-plus"></i>추가</button>
                                <button type="button" class="ds-btn d-none" id="maCancelBtn" onclick="cancelMenuAuthorityEdit()">취소</button>
                            </div>
                        </div>
                        <div class="rel-list" id="menuAuthorityList"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</html>
