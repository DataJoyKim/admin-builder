<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<script th:fragment="script">
    App.codes = {
        "YN_CD":[
            {code:"true",name:"Y"},
            {code:"false",name:"N"}
        ]
    };

    let codes;
    let functionName;

    $( document ).ready(function() {
        init();
    });

    function init() {
        setDatSourceAsNotification();

        Sheet.initSheet('executeGrid', "100%", "250px",
            {
                useSeq:false,
                useStatus:false,
                useDelete:true,
                useExpendLastColumn:true
            },
            [
                {field:'key', label:'파라미터', type:'text', width:400, editable: true, align:'left', required:false},
                {field:'value', label:'값', type:'text', width:400, editable: true, align:'left', required:false}
            ]);

        App.modalPopup.receiveParam('FUNC_REQUEST', function(data){
            if(!data.functionName) {
                alert('기능코드가 존재하지않습니다.');
            }

            functionName = data.functionName;
            getNotification(functionName);
        });
    }

    function setDatSourceAsNotification() {
        httpClient.get(`/console/api/datasource/notification`, {},
            function(response){
                let codes = new Array();
                for(let i=0; i<response.length; i++) {
                    codes.push({code:response[i].dataSourceName,name:response[i].displayName});
                }

                App.util.setCodeBox("dataSourceName", codes);
            },
            function(error){
                alert('error');
            }
        );
    }

    function execute() {
        let executeTarget = $("#notificationName").val();

        let contents = {};
        const gridData = executeGrid.getSheetData();

        for(const data of gridData) {
            if(data.value == "null") {
                contents[data.key] = null;
            }
            else {
                contents[data.key] = data.value;
            }
        }

        httpClient.get(`/console/api/notification/${executeTarget}/execute`,contents,
            function(response){
                $("#responseData").val(JSON.stringify(response,null,3));
            },
            function(error){
                $("#responseData").val(JSON.stringify(error.responseJSON,null,3));
            }
        );

    }

    function getNotification(functionName) {
        httpClient.get(`/console/api/notification`, {notificationName:`${functionName}`},
            function(response){
                let data = response[0];
                if(data) {
                    setContent({
                        id:data.id,
                        notificationName:data.notificationName,
                        displayName:data.displayName,
                        dataSourceName:data.dataSourceName,
                        subject:data.subject,
                        content:data.content
                    });
                }
                else {
                    setContent({
                        id:'',
                        notificationName:functionName,
                        displayName:'',
                        dataSourceName:'',
                        subject:'',
                        content:''
                    });
                }
            },
            function(error){
                alert('error');
            }
        );
    }

    function getContent() {
        return {
            id: $("#id").val(),
            notificationName: $("#notificationName").val(),
            displayName: $("#displayName").val(),
            dataSourceName: $("#dataSourceName").val(),
            subject: $("#subject").val(),
            content: $("#content").val()
        }
    }

    function setContent(params) {
        $("#id").val(params.id);
        $("#notificationName").val(params.notificationName);
        $("#displayName").val(params.displayName);
        $("#dataSourceName").val(params.dataSourceName);
        $("#subject").val(params.subject);
        $("#content").val(params.content);
    }

    function save() {
        httpClient.post(`/console/api/notification/save`,{},
            getContent(),
            function(response){
                alert("저장완료되었습니다.");
                getNotification($("#notificationName").val());
            },
            function(error){
                alert('error');
            }
        );
    }

    function deleteNotification() {
      let id = $("#id").val();

      httpClient.delete(`/console/api/notification/${id}`, {},
          function(response){
              alert("삭제 되었습니다.");
              getNotification($("#notificationName").val());
          },
          function(error){
              alert('error');
          }
      );
    }
</script>
<div th:fragment="view">
    <div class="card">
        <div class="card-header p-0 border-bottom-0">
            <ul class="nav nav-tabs" id="detail-tab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="workflow-def-tab" data-toggle="pill" href="#workflow-def" role="tab" aria-controls="workflow-def" aria-selected="true">
                        Definition
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="execute-tab" data-toggle="pill" href="#execute" role="tab" aria-controls="execute" aria-selected="false">
                        Execute
                    </a>
                </li>
            </ul>
        </div>
        <div class="card-body">
            <div class="tab-content" id="detail-tabContent" >

                <div class="tab-pane fade show active" id="workflow-def" role="tabpanel" aria-labelledby="workflow-def-tab">

                    <div class="card-body">
                        <div class="row">
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="save()" >
                                    <i class="btn-icon fas fa-save"></i>
                                    <span class="btn-label">Save</span>
                                </button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-1 d-none">
                                <label for="id">ID</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="id" autocomplete="off" >
                            </div>
                            <div class="form-group col-3">
                                <label for="notificationName">알림명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="notificationName" autocomplete="off" disabled>
                            </div>
                            <div class="form-group col-3">
                                <label for="displayName">화면노출명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="displayName" autocomplete="off">
                            </div>
                            <div class="form-group col-3">
                                <label for="dataSourceName">데이터소스</label>
                                <select class="form-control form-control-sm" id="dataSourceName" >
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-12">
                                <label for="subject">제목</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="subject" autocomplete="off">
                            </div>
                            <div class="form-group col-12">
                                <label>내용</label>
                                <textarea id="content" name="content" rows="30" style="width:100%" ></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="execute" role="tabpanel" aria-labelledby="execute-tab">
                    <div class="card-body">
                        <div class="row">
                            <label>파라미터</label>
                            <div style=" display: flex; margin-left: auto;">
                                <button type="button" class="btn btn-default btn-sm" onclick="executeGrid.addRowData()" >
                                    <i class="btn-icon fas fa-plus"></i>
                                    <span class="btn-label">Add</span>
                                </button>
                                <button type="button" class="btn btn-success btn-sm" onclick="execute()" >
                                    <i class="btn-icon fas fa-play"></i>
                                    <span class="btn-label">Run</span>
                                </button>
                            </div>
                            <div id="executeGrid"></div>
                        </div>
                        <div class="row">
                            <label>실행 결과</label>
                            <textarea class="col-12" id="responseData"  rows="15" ></textarea>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</html>
