<html xmlns:th="http://www.thymeleaf.org">
<style th:fragment="style">
</style>
<script th:fragment="script">
        $( document ).ready(function() {
            init();
        });

        function init() {

            Sheet.initSheet('jsGrid1', "100%", "800px",
                {
                    useSeq:true,
                    useStatus:false,
                    useDelete:false,
                    useExpendLastColumn:true,
                    offCellFocus:true,
                    offDisableColumnColor:true,
                },
                [
                    {field:'id', label:'ID', type:'text', width:30, hide:true, editable: true, align:'center', required:true},
                    {field:'dataSourceName', label:'dataSource 명', type:'text', width:300, editable: true, align:'left', required:false},
                    {field:'displayName', label:'화면노출명', type:'text', width:300, editable: true, align:'left', required:false},
                    {field:'note', label:'비고', type:'text', width:100, editable: true, align:'left', required:false}
                ],
                {
                    onSelectionChanged:function(row) {
                        selectedContent(row);
                    }
                });

            getDataSource();
        }

        function getDataSource() {
            httpClient.get(`/console/api/datasource/notification`, {},
                function(response){
                    jsGrid1.setSheetData(response);
                },
                function(error){
                    alert('error');
                }
            );
        }

        function selectedContent(item) {
            httpClient.get(`/console/api/datasource/notification/${item.id}`, {},
                function(response){
                    setContentData(response);
                },
                function(error){
                    alert('error');
                }
            );
        }

        function isEmpty(v) {
            return (v == undefined || v == null || v == '');
        }

        function save() {
            let id = $("#id").val();

            if(isEmpty(id))
                insertContent();
            else
                updateContent(id);
        }

        function insertContent() {
            httpClient.post(`/console/api/datasource/notification`,{},getContent(),
                function(response){
                    alert("저장완료되었습니다.");
                    getDataSource();
                },
                function(error){
                    alert('error');
                }
            );
        }

        function updateContent(id) {
          httpClient.put(`/console/api/datasource/notification/${id}`, {}, getContent(),
              function(response){
                  alert("저장완료되었습니다.");
                  getDataSource();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function deleteContent() {
          let id = $("#id").val();

          httpClient.delete(`/console/api/datasource/notification/${id}`, {},
              function(response){
                  alert("삭제 처리 완료되었습니다.");
                  getDataSource();
              },
              function(error){
                  alert('error');
              }
          );
        }

        function refreshDataSource() {
          let id = $("#id").val();

          httpClient.post(`/console/api/datasource/notification/${id}/refresh`,{},{},
              function(response){
                  alert("갱신 완료되었습니다.");
              },
              function(error){
                  alert('error');
              }
          );
        }

        function validateConnectDataSource() {
            let id = $("#id").val();

            httpClient.get(`/console/api/datasource/notification/${id}/connect-valid`, {},
                function(response){
                    if(response != null && response.result === true) {
                        alert("연결 성공");
                    }
                    else {
                        alert("연결 실패");
                    }
                },
                function(error){
                    alert('error');
                }
            );
        }

        function setContentData(response) {
            setContent({
                id:response.id,
                displayName:response.displayName,
                dataSourceName:response.dataSourceName,
                note:response.note,
                type:response.type,
                options:response.options
              });

            changeType();
        }

        function getContent() {
            let options = null;
            const type = $("#type").val();
            if(type === "SMTP") {
                options = {
                    host:$("#host").val(),
                    port:$("#port").val(),
                    username:$("#username").val(),
                    password:$("#password").val(),
                    connectionTimeout:$("#connectionTimeout").val(),
                    writeTimeout:$("#writeTimeout").val(),
                    timeout:$("#timeout").val(),
                    smtpContentType:$("#smtpContentType").val(),
                    smtpSecurityType:$("#smtpSecurityType").val(),
                    sslProtocols:$("#sslProtocols").val()
                }

                options = JSON.stringify(options);
            }

            return {
                id: $("#id").val(),
                displayName: $("#displayName").val(),
                dataSourceName: $("#dataSourceName").val(),
                note: $("#note").val(),
                type: type,
                options: options
            }
        }

        function setContent(params) {
            $("#id").val(params.id);
            $("#displayName").val(params.displayName);
            $("#dataSourceName").val(params.dataSourceName);
            $("#note").val(params.note);
            $("#type").val(params.type);

            const options = JSON.parse(params.options);
            if(params.type === "SMTP") {
                $("#host").val(options.host);
                $("#port").val(options.port);
                $("#username").val(options.username);
                $("#password").val(options.password);
                $("#connectionTimeout").val(options.connectionTimeout);
                $("#writeTimeout").val(options.writeTimeout);
                $("#timeout").val(options.timeout);
                $("#smtpContentType").val(options.smtpContentType);
                $("#smtpSecurityType").val(options.smtpSecurityType);
                $("#sslProtocols").val(options.sslProtocols);
            }
          }

          function newContent(){
            setContent({
                id:'',
                displayName:'',
                dataSourceName:'',
                note:'',
                type:''
              });
          }

          function changeType() {
              clearOptionGrid();

              const type = $("#type").val();
              if(type === "SMTP") {
                  showOptionGird("op-grid-smtp");
              }
          }

          function clearOptionGrid() {
              $("#op-grid-smtp").addClass("d-none");
          }
          function showOptionGird(id){
              $("#"+id).removeClass("d-none");
          }
    </script>
<div th:fragment="view">
    <div class="row">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">DataSource</h3>
                        <div class="card-tools">
                            <button type="button" class="btn btn-default btn-sm" onclick="getDataSource()" >
                                <i class="btn-icon fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="jsGrid1"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">상세 내용</h3>
                        <div class="card-tools">
                            <button type="button" class="btn btn-default btn-sm" onclick="newContent()" >
                                <i class="btn-icon fas fa-plus"></i>
                                <span class="btn-label">Create</span>
                            </button>
                            <button type="button" class="btn btn-default btn-sm" onclick="save()" >
                                <i class="btn-icon fas fa-save"></i>
                                <span class="btn-label">Save</span>
                            </button>
                            <button type="button" class="btn btn-default btn-sm" onclick="deleteContent()" >
                                <i class="btn-icon fas fa-trash"></i>
                                <span class="btn-label">Delete</span>
                            </button>
                            <button type="button" class="btn btn-default btn-sm" onclick="refreshDataSource()" >
                                <i class="btn-icon fas fa-arrow-up"></i>
                                <span class="btn-label">Refresh</span>
                            </button>
                            <button type="button" class="btn btn-default btn-sm" onclick="validateConnectDataSource()" >
                                <i class="btn-icon fas fa-check"></i>
                                <span class="btn-label">Check</span>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="form-group col-1 d-none">
                                <label for="id">ID</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="id" autocomplete="off" disabled>
                            </div>
                            <div class="form-group col-3">
                                <label for="dataSourceName">DataSource 명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="dataSourceName" autocomplete="off" >
                            </div>
                            <div class="form-group col-3">
                                <label for="displayName">화면 노출명</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="displayName" autocomplete="off" >
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-5">
                                <label for="note">note</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="note" autocomplete="off" >
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-3">
                                <label for="type">유형</label>
                                <select class="form-control form-control-sm rounded-1 form-select" id="type" onchange="changeType()">
                                    <option value="">선택</option>
                                    <option value="SMTP">SMTP</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">옵션</h3>
                    </div>
                    <div class="card-body d-none" id="op-grid-smtp">
                        <div class="row">
                            <div class="form-group col-6">
                                <label for="host">host</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="host" autocomplete="off" >
                            </div>
                            <div class="form-group col-2">
                                <label for="port">port</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="port" autocomplete="off" >
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-3">
                                <label for="username">username</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="username" autocomplete="off" >
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-3">
                                <label for="password">password</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="password" autocomplete="off" >
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-3">
                                <label for="smtpContentType">Content Type</label>
                                <select class="form-control form-control-sm rounded-1 form-select" id="smtpContentType" >
                                    <option value="">선택</option>
                                    <option value="HTML">Html</option>
                                    <option value="TEXT">Text</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-3">
                                <label for="smtpSecurityType">Security Type</label>
                                <select class="form-control form-control-sm rounded-1 form-select" id="smtpSecurityType" >
                                    <option value="">선택</option>
                                    <option value="STARTTLS">STARTTLS</option>
                                    <option value="SSL_TLS">SSL/TLS</option>
                                </select>
                            </div>
                            <div class="form-group col-3">
                                <label for="sslProtocols">SSL Protocols</label>
                                <input type="text" class="form-control form-control-sm rounded-0" id="sslProtocols" autocomplete="off" >
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-3">
                                <label for="connectionTimeout">connectionTimeout</label>
                                <input type="number" class="form-control form-control-sm rounded-0" id="connectionTimeout" autocomplete="off" >
                            </div>
                            <div class="form-group col-3">
                                <label for="writeTimeout">writeTimeout</label>
                                <input type="number" class="form-control form-control-sm rounded-0" id="writeTimeout" autocomplete="off" >
                            </div>
                            <div class="form-group col-3">
                                <label for="timeout">timeout</label>
                                <input type="number" class="form-control form-control-sm rounded-0" id="timeout" autocomplete="off" >
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>
